# Home Assistant "app" (Supervisor add-on) repository manifest.
# https://developers.home-assistant.io/docs/apps/repository
#
# This lets someone add this SAME repo (already used for the HACS
# integration install, see README.md's own "Install (HACS)" section) as
# an app repository too: Settings -> Add-ons -> Add-on Store -> the
# three-dot menu -> Repositories -> paste this repo's URL. Home Assistant
# then finds nimbus_solver_app/ (any folder with its own config.yaml) and
# offers it for install.
#
# This is a genuinely separate mechanism from HACS -- HACS installs
# Python custom_components (config_flow: true in manifest.json, see
# custom_components/nimbus_load/), while an "app"/add-on is a full Docker
# container the Supervisor builds and runs standalone, only ever talking
# to Home Assistant over its REST API. One repo, two independent install
# paths, because they solve two genuinely different problems here: the
# Forecaster (HACS) needs zero shell access anywhere and works the same
# on every platform; the Solver's live dispatch (this app) needs real
# shell/cron-equivalent scheduling and a compiled LP solver (highspy) --
# HACS custom_components fundamentally can't provide either, an app can.
name: Nimbus
url: "https://github.com/code-imstillalive/nimbus"
maintainer: code-imstillalive
