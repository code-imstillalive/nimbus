# Pre-commit hooks for local dev.
#
# Purpose: catch the same drift CI already gates on before it ever reaches
# GitHub. Concretely, the ruff-format regression on d654a18 (17 files
# needing reformat) would have been flagged by these hooks on commit, so
# main wouldn't have gone red on the very next push after PR #68's
# strict-flip landed.
#
# Setup for a fresh clone (after `pip install -e '.[dev]'`):
#
#     pre-commit install
#
# ...then every `git commit` runs the hooks on staged files.
#
# Scope discipline (matches PR #69's approach):
#
#   IN:  the two ruff invocations CI runs strict (format + check), in
#        report-only mode so hooks abort the commit rather than silently
#        rewriting files. Matches CI's behaviour bit-for-bit and avoids
#        surprising a fast-moving contributor with unexpected diffs on
#        `git commit`. Plus a handful of trivial pre-commit-hooks stdlib
#        checks (trailing whitespace, EOF, YAML/TOML/JSON parse,
#        merge-conflict markers, large-file guard).
#
#   OUT: hassfest (needs Docker), mypy (advisory in CI -- flipping local
#        strict before CI is strict would create noise), pytest (too
#        slow for every commit), ruff's --fix mode (rewrites files).
#
# Ruff version-pin coherence:
#   Both the ruff-pre-commit rev below AND the CI's `pip install` line
#   pin the same ruff version. Bumping ruff is a deliberate act that
#   changes what the linter enforces; `pre-commit autoupdate` and a
#   matching one-liner in .github/workflows/ci.yml keep the two in sync
#   in a single reviewable PR.
#
#   2026-08-23 (#72 Stage 1): bumped 0.6.0 -> 0.16.4. At 0.6.0 the
#   check-side hook id was plain `ruff`; 0.16.4 renamed the canonical id
#   to `ruff-check` (confirmed directly against ruff-pre-commit's own
#   .pre-commit-hooks.yaml at the v0.16.4 tag) and kept `ruff` around
#   only as a legacy alias -- switched to the canonical id below rather
#   than lean on an alias that could be dropped in a future release.
#
# Related: #36 (DevOps lifecycle, Stage 1), #72 (ruff version bump).
# Ruff config itself lives in pyproject.toml (added in #69), so hooks
# and CI read the same ruleset.

# nimbus issue #358 (Mark Purcell) flagged this as mismatched against
# requires-python (">=3.14.4"). Left at 3.12 deliberately -- see
# pyproject.toml's own [tool.ruff] target-version comment for why:
# bumping ruff's target-version to match 3.14 turned out to make ruff
# format rewrite every multi-exception `except (A, B):` into 3.14-only
# unparenthesized syntax, which breaks local dev on any machine that
# isn't already on 3.14. Revisit both together once local dev
# environments are confirmed upgraded.
default_language_version:
  python: python3.12

repos:
  # ---------------------------------------------------------------------
  # ruff: mirrors the two invocations wired into .github/workflows/ci.yml
  # exactly.
  #     CI runs: ruff format --check custom_components/ tests/
  #              ruff check         custom_components/ tests/
  # Local hooks do the same -- report on staged files, exit non-zero on
  # findings, don't rewrite. Both read [tool.ruff] config from
  # pyproject.toml, so local and CI stay bit-identical.
  # ---------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # `ruff-format`'s own entry is `ruff format --force-exclude` (no
      # --check by default) -- --check added explicitly so it matches
      # CI's `ruff format --check` exactly: report only, non-zero on
      # findings, no rewrites.
      - id: ruff-format
        name: ruff format --check (custom_components/ tests/)
        args: [--check]
        files: ^(custom_components|tests)/
      # Canonical check-side hook id as of 0.16.4 (was plain `ruff` at
      # 0.6.0 -- see this file's own header comment). Entry is already
      # `ruff check --force-exclude` with no --fix, matching CI exactly
      # by default.
      - id: ruff-check
        name: ruff check (custom_components/ tests/)
        files: ^(custom_components|tests)/

  # ---------------------------------------------------------------------
  # Stdlib pre-commit hooks: trivial, universally-safe checks.
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve markdown hard-break trailing spaces (two-space + newline).
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
