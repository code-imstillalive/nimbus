blueprint:
  name: Nimbus battery dispatch
  description: >-
    Makes your battery follow Nimbus's plan. Every minute, and shortly after
    each new plan, it reads `sensor.nimbus_solver_battery_forecast` (planned
    battery power now, kW: positive = discharge, negative = charge) and runs
    the actions you give it for Charge, Discharge, Self-Consume or Hold.


    Nimbus never commands your inverter itself. This blueprint is the step
    that does, and it is yours: you choose the actions for your hardware.


    Safety, built in: nothing happens unless your arm switch is on; turning it
    off runs your fallback actions; an unknown, non-numeric, failed or stale
    plan runs the fallback instead of a power command; power is clamped to
    your limit; a minimum dwell stops the battery flipping between modes.
    Read the going-live guide first:
    https://code-imstillalive.github.io/nimbus/going-live/
  domain: automation
  author: Nimbus
  source_url: https://github.com/code-imstillalive/nimbus/blob/main/blueprints/automation/nimbus/battery_dispatch.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    nimbus:
      name: Nimbus
      icon: mdi:cloud-outline
      input:
        plan_sensor:
          name: Nimbus plan sensor
          description: >-
            Nimbus's battery plan, normally
            sensor.nimbus_solver_battery_forecast.
          selector:
            entity:
              filter:
                - integration: nimbus_load
                  domain: sensor
        hold_sensor:
          name: Nimbus hold signal (optional)
          description: >-
            sensor.nimbus_solver_current_dispatch_hold. True when the plan keeps
            the battery idle while the grid supplies the house; used to choose
            Hold instead of Self-Consume. Leave empty to never use Hold.
          default: ""
          selector:
            entity:
              filter:
                - integration: nimbus_load
                  domain: sensor
        solar_charge_sensor:
          name: Nimbus solar-charge signal (optional)
          description: >-
            sensor.nimbus_solver_current_dispatch_solar_charge. True when the
            plan charges the battery from solar alone and sells nothing; used
            to choose Self-Consume instead of a forced Charge, so a morning
            duller than forecast charges from the sun there is rather than
            from the grid. Leave empty to always force the plan's charge.
          default: ""
          selector:
            entity:
              filter:
                - integration: nimbus_load
                  domain: sensor
        allowed_charge_sensor:
          name: Nimbus allowed charge (site import limit)
          description: >-
            sensor.nimbus_battery_allowed_charge_kw: the most the battery may
            charge right now without grid import passing the Solver's Site
            Import Limit, from the live grid meter. The charge sent is never
            above it, so a car, oven or kettle switching on cannot push the
            site over its supply. Unavailable (no limit set) means no cap.
          default: sensor.nimbus_battery_allowed_charge_kw
          selector:
            entity:
              filter:
                - integration: nimbus_load
                  domain: sensor
    safety:
      name: Arming and safety
      icon: mdi:shield-check
      input:
        arm_switch:
          name: Arm switch
          description: >-
            An input_boolean you create (for example "Nimbus dispatch armed").
            This is the only thing that lets the plan move your battery. Off:
            the automation commands nothing except your fallback, once.
            While armed, a fallback the plan needs is re-sent like any other
            mode command (see "Re-send the mode command").
          selector:
            entity:
              filter:
                - domain: input_boolean
        fallback_actions:
          name: Fallback actions
          description: >-
            What your inverter should do when Nimbus is not in control: on
            disarm, and whenever the plan is unknown, failed or stale. Normally
            your inverter's own self-consumption mode. Required: disabling an
            automation does not clear the last command your inverter received.
          selector:
            action: {}
        stale_after_minutes:
          name: Stale plan after
          description: >-
            A plan older than this is not followed; the fallback runs instead.
            Nimbus re-plans every minute or so, so a few minutes catches a
            stopped Solver without tripping on a slow solve.
          default: 10
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: min
              mode: box
        reload_grace_minutes:
          name: Ride through a Nimbus reload
          description: >-
            Saving a Nimbus setting reloads it, and its plan sensor is
            unavailable for a few seconds. For this long after the plan goes
            unavailable the automation keeps the last command instead of
            running the fallback; if the plan is still missing after that,
            the fallback runs. 0 runs the fallback at once.
          default: 2
          selector:
            number:
              min: 0
              max: 10
              unit_of_measurement: min
              mode: box
        max_power_kw:
          name: Maximum battery power
          description: >-
            The most this automation will ever ask for, in kW, whatever the
            plan says. Set it to your inverter's real limit or below.
          selector:
            number:
              min: 0.1
              max: 200
              step: 0.1
              unit_of_measurement: kW
              mode: box
        discharge_correction_pct:
          name: Discharge setpoint correction
          description: >-
            Scales the value sent while discharging, for an inverter that
            delivers a little less than it is asked for (a tester's exports
            about 4.5 % short even in sell-power mode: 104.5). 100 = no change
            (the default). Never above your maximum battery power. Charging
            is not scaled.
          default: 100
          selector:
            number:
              min: 90
              max: 115
              step: 0.5
              unit_of_measurement: "%"
              mode: box
        export_bias_kw:
          name: Export bias
          description: >-
            Added to the value sent while discharging, but only while the plan
            exports to the grid, for an inverter that delivers a steady amount
            less at the grid meter than it is asked for (a household measured
            about 0.35-0.4 kW short at both 14 and 10.5 kW). A fixed amount: it
            reads no meter, so it cannot swing. 0 = no change (the default).
            Never above your maximum battery power. Charging is not changed.
          default: 0
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              unit_of_measurement: kW
              mode: box
        discharge_setpoint:
          name: Discharge setpoint
          description: >-
            What {{ power_kw }} carries while discharging. "Battery power" (the
            default): the battery's planned power, house load included. "Grid
            export": the plan's export to the grid, for an inverter you drive
            in an export-target mode ("sell power", "feed-in power"), which
            covers the house load and its own losses itself; put that mode in
            "Enter Discharge mode". Charging always uses battery power.
          default: battery
          selector:
            select:
              options:
                - label: Battery power (default)
                  value: battery
                - label: Grid export (sell power mode)
                  value: export
        deadband_kw:
          name: Deadband
          description: A plan within this of 0 kW counts as idle.
          default: 0.05
          selector:
            number:
              min: 0
              max: 2
              step: 0.01
              unit_of_measurement: kW
              mode: box
    inverter:
      name: Your inverter
      icon: mdi:battery-charging
      input:
        charge_actions:
          name: Enter Charge mode
          description: >-
            Put the inverter into forced charging. Runs when the mode changes
            to Charge (every cycle if no mode helper is set below).
          selector:
            action: {}
        discharge_actions:
          name: Enter Discharge mode
          description: Put the inverter into forced discharging.
          selector:
            action: {}
        set_power_actions:
          name: Set charge/discharge power
          description: >-
            Write the power setpoint. Runs every cycle while charging or
            discharging. Use the variable {{ power_kw }}: the plan's power in
            kW, always positive, already clamped to your maximum. For an
            inverter driven by an export target instead (a "sell power" mode,
            where the inverter covers the house load and its own losses), use
            {{ export_kw }}: the plan's grid export now, kW, 0 or more.
          selector:
            action: {}
        self_consume_actions:
          name: Enter Self-Consume mode
          description: >-
            The inverter's own self-consumption mode: solar serves the house
            first, spare solar charges the battery, the battery serves the
            house. Used when the plan is idle, and when Nimbus says to soak up
            spare solar.
          selector:
            action: {}
        hold_actions:
          name: Enter Hold mode (optional)
          description: >-
            Keep the battery idle while the grid supplies the house (for
            example a forced 0 kW / stop command). Leave empty to use
            Self-Consume instead.
          default: []
          selector:
            action: {}
        keepalive_actions:
          name: Keep-alive (optional)
          description: >-
            Runs every cycle while charging, discharging or holding, for
            inverters whose remote-control mode times out without a heartbeat.
          default: []
          selector:
            action: {}
    behaviour:
      name: Behaviour
      icon: mdi:tune
      collapsed: true
      input:
        mode_helper:
          name: Mode helper (recommended)
          description: >-
            An input_text you create (for example "Nimbus dispatch mode"). The
            automation records the mode it set here, so it only re-sends a
            mode command when the mode changes, and so the minimum dwell can
            work. Without it, the mode command is re-sent every cycle and
            there is no dwell.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text
        min_dwell_minutes:
          name: Minimum dwell
          description: >-
            Once in a mode, stay at least this long before switching to
            another (needs the mode helper; 0 = off). The power setpoint inside
            the current mode still follows the plan every cycle. Never delays a
            price spike or a large reversal.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: min
              mode: box
        reversal_kw:
          name: Reversal that skips the dwell
          description: >-
            A switch straight between Charge and Discharge at or above this
            power is never delayed.
          default: 5
          selector:
            number:
              min: 0
              max: 200
              step: 0.5
              unit_of_measurement: kW
              mode: box
        mode_select:
          name: Manual mode select (optional)
          description: >-
            An input_select with the options Automatic, Charge, Discharge,
            Preserve and Self-Consume (the Control Panel card's AUTO, CH, DIS,
            PRE and SC buttons set it). Anything but Automatic overrides the
            plan until Automatic is chosen again: Charge and Discharge at the
            maximum battery power (a charge never above the allowed charge),
            Preserve holds the battery, Self-Consume hands it to the inverter.
            The arm switch still gates everything. Leave empty to always
            follow the plan.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_select
        use_absorb:
          name: Soak up spare solar
          description: >-
            When Nimbus publishes absorb_surplus (Don't sell below is set, the
            export price is under it, there is spare solar, the plan is not
            discharging or grid-charging, and no P2P block or price spike),
            use Self-Consume so every spare kW goes into the battery instead of
            the grid. The plan's charge rate alone would export the extra.
          default: true
          selector:
            boolean: {}
        resend_minutes:
          name: Re-send the mode command
          description: >-
            With a mode helper, a mode command (including the fallback) is sent
            when the mode changes, after every Home Assistant start, and again
            every this many minutes while the mode stays the same, in case one
            was lost or the inverter reverted on its own. 0 = only on a change
            and at start.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: min
              mode: box

# Queued, not single: a trigger arriving while a slow action is still running
# waits its turn (each run reads the state afresh) instead of being dropped
# silently; more than three waiting is logged.
mode: queued
max: 3
max_exceeded: warning

triggers:
  - trigger: state
    entity_id: !input plan_sensor
    for: "00:00:10"
    id: plan
  - trigger: time_pattern
    minutes: /1
    id: tick
  # nimbus #2257: answer a load switching on within seconds, not at the tick.
  - trigger: state
    entity_id: !input allowed_charge_sensor
    id: allowed
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: !input arm_switch
    to: "on"
    id: armed
  - trigger: state
    entity_id: !input arm_switch
    to: "off"
    id: disarmed

variables:
  plan_entity: !input plan_sensor
  hold_entity: !input hold_sensor
  solar_charge_entity: !input solar_charge_sensor
  arm_entity: !input arm_switch
  mode_entity: !input mode_helper
  stale_min: !input stale_after_minutes
  grace_min: !input reload_grace_minutes
  max_kw: !input max_power_kw
  setpoint_basis: !input discharge_setpoint
  correction_pct: !input discharge_correction_pct
  export_bias: !input export_bias_kw
  dead_kw: !input deadband_kw
  dwell_min: !input min_dwell_minutes
  reversal_min_kw: !input reversal_kw
  absorb_on: !input use_absorb
  resend_min: !input resend_minutes
  hold_has_actions: !input hold_actions
  plan_raw: "{{ states(plan_entity) }}"
  # A tester, 21 Nov 2026: a Nimbus reload (any settings save) leaves the plan
  # unavailable for a few seconds. True while it has only just gone missing:
  # keep the last command rather than run the fallback.
  plan_gap: >-
    {% set s = states[plan_entity] %}
    {{ s is not none and plan_raw in ['unavailable', 'unknown']
       and (now() - s.last_changed).total_seconds()
           < (grace_min | float(2)) * 60 }}
  plan_ok: >-
    {% set s = states[plan_entity] %}
    {% set gen = state_attr(plan_entity, 'generated_at') %}
    {% set gen_t = as_datetime(gen) if gen else none %}
    {% set age_s = (now() - gen_t).total_seconds() if gen_t else
       ((now() - s.last_updated).total_seconds() if s else 999999) %}
    {{ s is not none and is_number(plan_raw)
       and state_attr(plan_entity, 'status') == 'optimal'
       and age_s <= (stale_min | float(10)) * 60 }}
  # nimbus #2573: the HOME battery's own planned power when the plan carries
  # it (a site with a car or second battery as a participant); the state is
  # the whole fleet. Plans from before #2573 have no home_battery_kw.
  # A tester, 22 Nov 2026: discharge planned for a 17:00 price rise started
  # at 17:01:45, after the next plan landed, though the plan made at 16:59
  # already had its 17:00 row. Index of the plan row for the current minute
  # when it is past period 0 AND a price (import, export or P2P rate) changes
  # there; otherwise 0, period 0 as before, so between price changes period
  # 0's anti-flap hysteresis (#1654) still decides.
  now_i: >-
    {% set f = state_attr(plan_entity, 'forecast') %}
    {% set ns = namespace(i=0) %}
    {% if plan_ok and f is iterable and f is not string and f | length > 1 %}
      {% for e in f[:15] %}
        {% set t = as_datetime(e.time) if e.time is defined and e.time else none %}
        {% if t is not none and t <= now() %}{% set ns.i = loop.index0 %}{% endif %}
      {% endfor %}
      {% if ns.i > 0 %}
        {% set a = f[0] %}{% set b = f[ns.i] %}
        {% if a.import_price == b.import_price and a.export_price == b.export_price
              and a.p2p_rate == b.p2p_rate %}{% set ns.i = 0 %}{% endif %}
      {% endif %}
    {% endif %}
    {{ ns.i }}
  row_kw: >-
    {% set i = now_i | int(0) %}
    {% set ns = namespace(v='') %}
    {% if i > 0 %}
      {% for b in state_attr(plan_entity, 'batteries') or [] %}
        {% if b.name == 'home' and b.forecast | length > i %}
          {% set ns.v = (b.forecast[i].discharge_kw | float(0))
                        - (b.forecast[i].charge_kw | float(0)) %}
        {% endif %}
      {% endfor %}
      {% if ns.v == '' %}
        {% set ns.v = state_attr(plan_entity, 'forecast')[i].battery_kw | float(0) %}
      {% endif %}
    {% endif %}
    {{ ns.v }}
  plan_kw: >-
    {% set h = state_attr(plan_entity, 'home_battery_kw') %}
    {% if not plan_ok %}0
    {% elif is_number(row_kw) %}{{ row_kw | float(0) }}
    {% else %}{{ (h if is_number(h) else plan_raw) | float(0) }}{% endif %}
  manual_entity: !input mode_select
  # Household, 21 Nov 2026: a manual mode from the select, or '' to follow
  # the plan.
  manual: >-
    {% set m = states(manual_entity) if manual_entity else '' %}
    {%- if m == 'Charge' -%}CHG{%- elif m == 'Discharge' -%}DIS
    {%- elif m == 'Preserve' -%}HOLD{%- elif m == 'Self-Consume' -%}SC
    {%- endif -%}
  allowed_entity: !input allowed_charge_sensor
  allowed_raw: "{{ states(allowed_entity) if allowed_entity else 'unavailable' }}"
  plan_power_kw: >-
    {{ max_kw | float(0) if manual in ['CHG', 'DIS']
       else [plan_kw | abs, max_kw | float(0)] | min }}
  # nimbus #2257: a charge is never above the live allowance.
  battery_power_kw: >-
    {% set p = plan_power_kw | float(0) %}
    {% if (manual == 'CHG' or (manual == '' and plan_kw < 0))
          and is_number(allowed_raw) %}
      {% set p = [p, allowed_raw | float(0)] | min %}
    {% endif %}
    {{ p | round(2) }}
  # A tester, 23 Nov 2026: their inverter's power setpoint is battery-side,
  # so a 15.54 kW AC plan (15 kW export + house) exported ~14.7 kW after
  # conversion losses. The plan's grid export for the minute being followed,
  # for an export-target ("sell power") mode. A manual Discharge has no plan
  # export, so it uses the discharge power.
  export_kw: >-
    {% set i = now_i | int(0) %}
    {% set f = state_attr(plan_entity, 'forecast') %}
    {% if manual == 'DIS' %}{{ battery_power_kw }}
    {% elif manual != '' or not plan_ok or not (f is iterable and f is not string)
          or f | length <= i %}0
    {% else %}{{ [(f[i].get('grid_export_kw', 0) if f[i] is mapping else 0) | float(0), 0] | max | round(2) }}{% endif %}
  # absorb_surplus describes period 0; on a later row it still applies
  # unless that row discharges.
  absorb: >-
    {{ absorb_on and state_attr(plan_entity, 'absorb_surplus') == true
       and (now_i | int(0) == 0 or plan_kw <= dead_kw | float(0.05)) }}
  # On a later row, that row's own hold and solar-charge flags.
  hold_signal: >-
    {% set i = now_i | int(0) %}
    {% if hold_entity == '' %}{{ false }}
    {% elif i > 0 %}{{ state_attr(plan_entity, 'forecast')[i].dispatch_hold == true }}
    {% else %}{{ states(hold_entity) in ['True', 'true', 'on'] }}{% endif %}
  solar_charge: >-
    {% set i = now_i | int(0) %}
    {% if solar_charge_entity == '' %}{{ false }}
    {% elif i > 0 %}{{ state_attr(plan_entity, 'forecast')[i].dispatch_solar_charge == true }}
    {% else %}{{ states(solar_charge_entity) in ['True', 'true', 'on'] }}{% endif %}
  want: >-
    {%- if manual == 'HOLD' and hold_has_actions | length == 0 -%}SC
    {%- elif manual -%}{{ manual }}
    {%- elif not plan_ok -%}FALLBACK
    {%- elif absorb -%}SC
    {%- elif plan_kw > dead_kw | float(0.05) -%}DIS
    {%- elif plan_kw < -(dead_kw | float(0.05)) and solar_charge -%}SC
    {%- elif plan_kw < -(dead_kw | float(0.05)) -%}CHG
    {%- elif hold_signal and hold_has_actions | length > 0 -%}HOLD
    {%- else -%}SC{%- endif -%}
  current: "{{ states(mode_entity) if mode_entity != '' else 'unknown' }}"
  held_s: >-
    {% set m = states[mode_entity] if mode_entity != '' else none %}
    {{ (now() - m.last_changed).total_seconds() if m else 999999 }}
  dwell_exempt: >-
    {% set spike = state_attr(plan_entity, 'price_spike_active') == true %}
    {% set reversal = current in ['CHG', 'DIS'] and want in ['CHG', 'DIS']
       and current != want and (plan_kw | abs) >= reversal_min_kw | float(5) %}
    {{ spike or reversal or want == 'FALLBACK' or manual != '' }}
  may_switch: >-
    {{ want == current or current not in ['CHG', 'DIS', 'SC', 'HOLD']
       or mode_entity == '' or (dwell_min | float(0)) == 0
       or (held_s | float(0)) >= (dwell_min | float(0)) * 60 or dwell_exempt }}
  target_mode: "{{ want if may_switch else current }}"
  # The value the power action sends (household, 23 Nov 2026: a setting a
  # user picks, not a template to edit). Battery power unless "Grid export"
  # is chosen and the battery is discharging.
  power_kw: >-
    {% if target_mode == 'DIS' %}
      {% set p = export_kw if setpoint_basis == 'export' else battery_power_kw %}
      {% set bias = export_bias | float(0) if export_kw | float(0) > 0.5 else 0 %}
      {{ ([p | float(0) * (correction_pct | float(100)) / 100 + bias,
           max_kw | float(0)] | min) | round(2) }}
    {% else %}{{ battery_power_kw }}{% endif %}
  mode_changed: "{{ mode_entity == '' or target_mode != current }}"
  # Re-send the current mode's command even though it has not changed: at
  # start (the helper survives a restart, the inverter's state may not), and
  # every resend_min minutes on the tick, in case a command was lost.
  resend: >-
    {% set every = resend_min | int(0) %}
    {{ trigger.id == 'start' or (trigger.id == 'tick' and every > 0
       and (now().hour * 60 + now().minute) % every == 0) }}
  send_mode: "{{ mode_changed or resend }}"

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: disarmed
      - condition: state
        entity_id: !input arm_switch
        state: "on"
  # Riding through a Nimbus reload: no command this cycle (never on disarm,
  # and a manual mode does not need the plan).
  - condition: template
    value_template: "{{ trigger.id == 'disarmed' or manual != '' or not plan_gap }}"
  # An allowance change matters only while it caps (or just stopped
  # capping) the charge, and by at least 0.5 kW: no write on every meter tick.
  - condition: template
    value_template: >-
      {{ trigger.id != 'allowed'
         or (plan_kw < 0
             and trigger.from_state is not none and trigger.to_state is not none
             and is_number(trigger.from_state.state)
             and is_number(trigger.to_state.state)
             and ((trigger.from_state.state | float(0)) < plan_power_kw | float(0)
                  or (trigger.to_state.state | float(0)) < plan_power_kw | float(0))
             and ((trigger.to_state.state | float(0))
                  - (trigger.from_state.state | float(0))) | abs >= 0.5) }}

actions:
  - choose:
      - alias: Disarmed, or the plan cannot be followed
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'disarmed' or target_mode == 'FALLBACK' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'disarmed' or send_mode }}"
            then:
              - sequence: !input fallback_actions
              - if:
                  - condition: template
                    value_template: "{{ mode_entity != '' }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: "{{ mode_entity }}"
                    data:
                      value: FALLBACK
      - alias: Charge
        conditions:
          - condition: template
            value_template: "{{ target_mode == 'CHG' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ send_mode }}"
            then: !input charge_actions
          - sequence: !input set_power_actions
          - sequence: !input keepalive_actions
      - alias: Discharge
        conditions:
          - condition: template
            value_template: "{{ target_mode == 'DIS' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ send_mode }}"
            then: !input discharge_actions
          - sequence: !input set_power_actions
          - sequence: !input keepalive_actions
      - alias: Hold
        conditions:
          - condition: template
            value_template: "{{ target_mode == 'HOLD' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ send_mode }}"
            then: !input hold_actions
          - sequence: !input keepalive_actions
    default:
      - alias: Self-Consume
        if:
          - condition: template
            value_template: "{{ send_mode }}"
        then: !input self_consume_actions
  - alias: Record the mode set
    if:
      - condition: template
        value_template: >-
          {{ mode_entity != '' and trigger.id != 'disarmed'
             and target_mode != 'FALLBACK' and target_mode != current }}
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ mode_entity }}"
        data:
          value: "{{ target_mode }}"
