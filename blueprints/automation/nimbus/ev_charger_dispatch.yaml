blueprint:
  name: Nimbus EV charger dispatch
  description: >-
    Makes a charger follow Nimbus's plan for the car plugged into it. Add the
    car as a Battery Participant first: Nimbus then plans its charging (departure hour,
    required charge, live charge limit, trip calendar) and publishes it on the
    car's own sensor, sensor.nimbus_solver_battery_N_kw (negative = charge).
    Every minute, and shortly after each new plan, this automation starts the
    charger at the planned power (as amps for your supply), changes the
    current as the plan moves, and stops it when the plan says not to charge.


    Nimbus never commands your charger itself. This blueprint is the step that
    does: you give it your charger's start, stop and set-current actions.


    Safety, built in: nothing happens unless your arm switch is on; turning it
    off runs your fallback actions; an unknown, failed or stale plan runs the
    fallback instead of a charge command; the current is kept between your
    charger's minimum and maximum; a plan below the minimum current holds the
    minimum for a few minutes and then stops the charger, rather than ask for
    less than it can do or start and stop on every small change.


    One automation per charger. A charger shared by several cars takes every
    car's planned-power sensor and, for each, a sensor saying that car is the
    one plugged in: it follows whichever car is connected, and never two.
    https://code-imstillalive.github.io/nimbus/going-live/
  domain: automation
  author: Nimbus
  source_url: https://github.com/code-imstillalive/nimbus/blob/main/blueprints/automation/nimbus/ev_charger_dispatch.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    nimbus:
      name: Nimbus
      icon: mdi:cloud-outline
      input:
        car_power_sensors:
          name: The cars' planned power
          description: >-
            Each car's own planned-power sensor,
            sensor.nimbus_solver_battery_N_kw (N = the car's slot; its
            battery_name attribute names it). Negative = charge. One car, or
            every car that uses this charger.
          selector:
            entity:
              multiple: true
              filter:
                - integration: nimbus_load
                  domain: sensor
        connected_sensors:
          name: Which car is plugged in
          description: >-
            For a charger shared by several cars: for each car above, in the
            same order, a binary sensor that is on while that car is the one
            plugged into this charger (for example the car's charger-connected
            sensor). The charger follows the car whose sensor is on. None on:
            the charger is stopped. More than one on, or a different number of
            sensors than cars: the fallback. Optional for a single car.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        plan_sensor:
          name: Nimbus plan sensor
          description: >-
            Nimbus's battery plan, normally
            sensor.nimbus_solver_battery_forecast. Read for its status and
            age only: a failed or stale plan is not followed.
          default: sensor.nimbus_solver_battery_forecast
          selector:
            entity:
              filter:
                - integration: nimbus_load
                  domain: sensor
    safety:
      name: Arming and safety
      icon: mdi:shield-check
      input:
        arm_switch:
          name: Arm switch
          description: >-
            An input_boolean you create (for example "Nimbus EV charging
            armed"). Off: the automation commands nothing except your fallback,
            once.
          selector:
            entity:
              filter:
                - domain: input_boolean
        fallback_actions:
          name: Fallback actions
          description: >-
            What the charger should do when Nimbus is not in control: on
            disarm, and whenever the plan is unknown, failed or stale. For
            example stop it, or hand it back to the charger's own schedule.
          selector:
            action: {}
        stale_after_minutes:
          name: Stale plan after
          default: 10
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: min
              mode: box
    charger:
      name: Your charger
      icon: mdi:ev-station
      input:
        start_actions:
          name: Start charging
          description: Runs when the plan starts a charge.
          selector:
            action: {}
        stop_actions:
          name: Stop charging
          description: Runs when the plan stops charging.
          selector:
            action: {}
        set_current_actions:
          name: Set the charging current
          description: >-
            Runs every cycle while charging. Use {{ amps }} (whole amps,
            already between your minimum and maximum) or {{ power_kw }}.
          selector:
            action: {}
        volts:
          name: Supply voltage
          default: 230
          selector:
            number:
              min: 100
              max: 260
              unit_of_measurement: V
              mode: box
        phases:
          name: Phases
          default: 1
          selector:
            select:
              options:
                - "1"
                - "3"
        min_amps:
          name: Minimum current
          default: 6
          selector:
            number:
              min: 1
              max: 63
              unit_of_measurement: A
              mode: box
        max_amps:
          name: Maximum current
          default: 32
          selector:
            number:
              min: 1
              max: 63
              unit_of_measurement: A
              mode: box
    behaviour:
      name: Behaviour
      icon: mdi:tune
      collapsed: true
      input:
        below_min_hold_minutes:
          name: Hold at the minimum before stopping
          description: >-
            When the plan drops below the charger's minimum current while
            charging, keep charging at the minimum this long before stopping,
            so a plan moving either side of the minimum does not start and
            stop the charger every cycle. A plan of no charge, or a
            discharge, stops it at once. Needs the charger state helper.
          default: 5
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: min
              mode: box
        state_helper:
          name: Charger state helper (recommended)
          description: >-
            An input_text you create. The automation records CHARGING,
            HOLDING, STOPPED or FALLBACK here, so start and stop run only when
            that changes, and the hold at the minimum can be timed. Without
            it start and stop run every cycle and there is no hold.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text

mode: queued
max: 3
max_exceeded: warning

triggers:
  - trigger: state
    entity_id: !input car_power_sensors
    for: "00:00:10"
    id: plan
  - trigger: time_pattern
    minutes: /1
    id: tick
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: !input arm_switch
    to: "on"
    id: armed
  - trigger: state
    entity_id: !input arm_switch
    to: "off"
    id: disarmed

variables:
  cars_in: !input car_power_sensors
  connected_in: !input connected_sensors
  plan_entity: !input plan_sensor
  state_entity: !input state_helper
  stale_min: !input stale_after_minutes
  v: !input volts
  ph: !input phases
  min_a: !input min_amps
  max_a: !input max_amps
  hold_min: !input below_min_hold_minutes
  # The car on this charger now: its sensor, '' when none is plugged in, or
  # '!' when that cannot be told (sensors and cars do not pair up, or more
  # than one car reads as plugged in).
  car_entity: >-
    {%- set cars = [cars_in] if cars_in is string else (cars_in or []) -%}
    {%- set conns = [] if not connected_in
        else ([connected_in] if connected_in is string else connected_in) -%}
    {%- if cars | count == 0 -%}!
    {%- elif conns | count == 0 -%}{{ cars[0] if cars | count == 1 else '!' }}
    {%- elif conns | count != cars | count -%}!
    {%- else -%}
      {%- set ns = namespace(on=[]) -%}
      {%- for c in conns -%}
        {%- if states(c) == 'on' -%}
          {%- set ns.on = ns.on + [cars[loop.index0]] -%}
        {%- endif -%}
      {%- endfor -%}
      {{- ns.on[0] if ns.on | count == 1
          else ('' if ns.on | count == 0 else '!') -}}
    {%- endif -%}
  car_raw: "{{ states(car_entity) if car_entity not in ['', '!'] else '' }}"
  plan_ok: >-
    {% set gen = state_attr(plan_entity, 'generated_at') %}
    {% set gen_t = as_datetime(gen) if gen else none %}
    {% set age_s = (now() - gen_t).total_seconds() if gen_t else 999999 %}
    {{ car_entity != '!'
       and (car_entity == '' or is_number(car_raw))
       and state_attr(plan_entity, 'status') == 'optimal'
       and age_s <= (stale_min | float(10)) * 60 }}
  # The plan's charge for the car now, kW (positive here).
  charge_kw: "{{ [0, -(car_raw | float(0))] | max if plan_ok else 0 }}"
  watts_per_amp: "{{ (v | float(230)) * (ph | int(1)) }}"
  want_amps: "{{ ((charge_kw | float(0)) * 1000 / (watts_per_amp | float(230))) | round(0) | int }}"
  current: "{{ states(state_entity) if state_entity != '' else 'unknown' }}"
  # Seconds the charger has been holding at the minimum.
  held_s: >-
    {% set s = states[state_entity] if state_entity != '' else none %}
    {{ (now() - s.last_changed).total_seconds()
       if s and current == 'HOLDING' else 0 }}
  want: >-
    {%- if not plan_ok -%}FALLBACK
    {%- elif car_entity == '' -%}STOPPED
    {%- elif (want_amps | int) >= (min_a | int(6)) -%}CHARGING
    {%- elif (want_amps | int) > 0 and current in ['CHARGING', 'HOLDING']
        and (held_s | float(0)) < (hold_min | float(5)) * 60 -%}HOLDING
    {%- else -%}STOPPED{%- endif -%}
  amps: >-
    {{ min_a | int(6) if want == 'HOLDING'
       else [[want_amps | int, min_a | int(6)] | max, max_a | int(32)] | min }}
  power_kw: "{{ ((amps | int) * (watts_per_amp | float(230)) / 1000) | round(2) }}"
  changed: "{{ state_entity == '' or want != current or trigger.id == 'start' }}"
  # Start only when the charger was not already charging (holding at the
  # minimum is still charging).
  starting: >-
    {{ state_entity == '' or trigger.id == 'start'
       or current not in ['CHARGING', 'HOLDING'] }}

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: disarmed
      - condition: state
        entity_id: !input arm_switch
        state: "on"

actions:
  - choose:
      - alias: Disarmed, or the plan cannot be followed
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'disarmed' or want == 'FALLBACK' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'disarmed' or changed }}"
            then: !input fallback_actions
      - alias: Charge (or hold at the minimum)
        conditions:
          - condition: template
            value_template: "{{ want in ['CHARGING', 'HOLDING'] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ starting }}"
            then: !input start_actions
          - sequence: !input set_current_actions
    default:
      - alias: Stop
        if:
          - condition: template
            value_template: "{{ changed }}"
        then: !input stop_actions
  - alias: Record the charger state
    if:
      - condition: template
        value_template: >-
          {{ state_entity != ''
             and (want != current or trigger.id == 'disarmed') }}
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ state_entity }}"
        data:
          value: "{{ 'FALLBACK' if trigger.id == 'disarmed' else want }}"
