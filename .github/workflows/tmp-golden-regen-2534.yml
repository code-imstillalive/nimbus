# TEMPORARY (#2534): regenerates the golden snapshots on CI's own Python and
# highspy, uploads them as an artifact, and is removed before merge.
name: tmp golden regen 2534
on:
  push:
    branches: [feat/2534-trust-closer-*]
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - run: pip show highspy | head -2
      - run: GOLDEN_UPDATE=1 pytest tests/test_golden_master.py -p no:homeassistant -q
      - run: git status --short tests/golden/ && git diff --stat tests/golden/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: golden-snapshots
          path: tests/golden/snapshots/
