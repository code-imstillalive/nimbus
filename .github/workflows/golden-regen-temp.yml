name: TEMP golden regen (#2205, removed before merge)
on:
  push:
    branches: [feat/rrp-crosscheck]
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - run: GOLDEN_UPDATE=1 python -m pytest tests/test_golden_master.py -p no:homeassistant || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: golden-snapshots
          path: tests/golden/snapshots/
