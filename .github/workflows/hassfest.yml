name: Validate with hassfest

# Official Home Assistant manifest/structure validator -- catches manifest.json
# errors, missing requirements, invalid domain names, and similar structural
# issues before a user's HACS install ever hits them. Zero maintenance cost,
# zero secrets, runs on every push and PR (issue #36, DevOps lifecycle step 2).
on:
  push:
    branches: [main]
  pull_request:

# nimbus issue #358 (Mark Purcell): read-only checkout + validator, never
# writes anything -- least-privilege default token scope.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master @ 2026-09-05
