name: HACS Validation

# Official HACS validator -- confirms this repo meets HACS's own structural
# requirements (hacs.json, brand assets, repository topics/description).
# Same zero-maintenance, zero-secrets rationale as hassfest.yml (issue #36,
# DevOps lifecycle step 2).
#
# Skipped while the repo is private: the HACS action's fetchers cannot read
# private-repo content through the default GITHUB_TOKEN, so `hacsjson` and
# `integration_manifest` always fail with "Got None" (see issue #49). The
# job auto-re-enables once the repo is made public.
on:
  push:
    branches: [main]
  pull_request:

# nimbus issue #358 (Mark Purcell): read-only checkout + validator, never
# writes anything -- least-privilege default token scope.
permissions:
  contents: read

jobs:
  validate:
    if: github.event.repository.visibility != 'private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
