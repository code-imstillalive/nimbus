# TEMPORARY (nimbus #2289 item 5, B.1): records the new native-twin golden
# snapshots on CI's interpreter, since snapshots are never recorded on a
# laptop. Removed in the same PR before it merges.
name: Golden record (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/golden-record-temp.yml"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - name: Record snapshots
        run: GOLDEN_UPDATE=1 python -m pytest tests/test_golden_master.py -p no:homeassistant -q
      - name: What changed
        run: git status --short tests/golden/snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: golden-snapshots
          path: tests/golden/snapshots/
