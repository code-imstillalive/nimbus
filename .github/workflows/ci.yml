name: CI

# Stage 2 of the DevOps cycle described in issue #36.
#
# This first pass of CI runs every check but tolerates existing tree drift.
# Rationale: the tree has never had ruff, mypy, or a HA-surface pytest run
# against it before, so a strict pass fails on ~33 mypy findings, ~27 files
# needing format, and 1 lint finding -- all of which are real work that
# belongs in follow-up PRs, not in this "add CI plumbing" PR.
#
# Advisory jobs swallow their step exit code with ` || true` so the step
# exits 0 cleanly. This is deliberately different from a plain
# `continue-on-error: true`: `continue-on-error` maps a red step outcome to
# a green step conclusion, but GitHub still surfaces the raw non-zero exit
# as a red [failure] annotation on the PR view. Piping `|| true` skips the
# non-zero exit entirely, so nothing surfaces except the step's log output,
# which is where the real information (which files need reformatting, what
# mypy/pytest actually found) lives anyway.
#
# Follow-up PRs will replace the ` || true` sink with the real strict
# invocation once each underlying issue is addressed:
#   - Lint / Format          -- after a repo-wide ruff format pass
#   - Type Check             -- after the 33 mypy findings are triaged (see #40 Platinum work)
#   - Unit Tests             -- after test dependencies are pinned in a pyproject.toml
#   - Add-on Build           -- after #48 fixes the Dockerfile build context
#   - HACS Validation        -- after #49 fixes the three repo-shape gaps (currently guarded by #51)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # STRICT: hassfest is the only check that already passes clean on the tree.
  # Every future PR is gated by this -- real HA manifest/strings/translations
  # regression is a genuine bug and should block merge.
  # ---------------------------------------------------------------------------

  hassfest:
    name: HA Manifest / Strings / Translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  # ---------------------------------------------------------------------------
  # STRICT: Lint (ruff check).
  # `ruff check` gates real lint findings on every PR. Format check is
  # split out to a separate advisory job below because the tree still has
  # ~26 files awaiting a repo-wide `ruff format` sweep, which is deferred
  # while test coverage lands rapidly on main.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "ruff==0.15.18"
      - name: Show ruff version and env
        run: |
          which ruff
          ruff --version
          python --version
          pwd
          ls -la
          ls custom_components/nimbus_load/solver/ | head
      - name: Ruff lint (strict) verbose
        run: ruff check --output-format=full custom_components/ tests/

  # ---------------------------------------------------------------------------
  # ADVISORY: Ruff format check.
  # Reports ~26 files needing reformat until a repo-wide `ruff format`
  # sweep lands. Kept advisory so PRs don't get gated on format churn
  # while tests are still landing on main every few hours.
  # ---------------------------------------------------------------------------

  format:
    name: Format (ruff format) [advisory]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pinned to keep strict `ruff check` deterministic; ruff's default
        # rule set expands across minor releases and can turn a clean
        # tree red after an unrelated CI cache refresh.
        run: pip install "ruff==0.15.18"
      - name: Ruff format check (advisory)
        # `|| true` (not continue-on-error: true) -- see Raf 4ccf9ba9a1dc
        # for the rationale.
        run: ruff format --check custom_components/ tests/ || true

  # ---------------------------------------------------------------------------
  # ADVISORY: Type Check (mypy).
  # 33 findings on current tree, mostly "Optional not handled" patterns in
  # solver/network.py, ml/model.py, and ml/gbrt.py. Real work, tracked as
  # part of #40 (Platinum quality-scale strict-typing).
  # ---------------------------------------------------------------------------

  typecheck:
    name: Type Check (mypy) [advisory]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mypy
        run: pip install mypy numpy
      - name: Run mypy (advisory)
        run: mypy custom_components/nimbus_load --ignore-missing-imports || true

  # ---------------------------------------------------------------------------
  # ADVISORY: Unit Tests (pytest).
  # Current tests are all solver+ML and pass locally; CI fails on missing
  # HA test-helper dependencies until a pyproject.toml or requirements-test.txt
  # pins them properly.
  # ---------------------------------------------------------------------------

  test:
    name: Unit Tests (pytest) [advisory]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio || true
          pip install numpy highspy || true
          pip install "pytest-homeassistant-custom-component" || true
      - name: Run pytest (advisory)
        run: |
          pytest tests/ \
            --cov=custom_components/nimbus_load \
            --cov-report=term-missing \
            --cov-report=xml \
            -v || true
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # HACS validation and Add-on build are deferred until #48 (Dockerfile
  # context) and #49 (HACS repo-shape gaps) land. Re-added in a follow-up
  # PR once those are addressed.
