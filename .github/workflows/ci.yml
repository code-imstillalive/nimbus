name: CI

# Stage 2 of the DevOps cycle described in issue #36.
# Every pull request runs this workflow; merge is blocked until every job is green.
#
# Design notes:
# - Jobs run in parallel, not serial — fastest signal for the developer.
# - continue-on-error is deliberately NOT used on any job. If lint or type-check
#   fails, we do want to keep running the other jobs to surface all issues at once
#   (matrix/parallel achieves that), but each job's own failure blocks merge.
# - Python 3.13 matches Home Assistant's own current baseline. When HA bumps its
#   minimum Python, bump here too.
# - This workflow deliberately does NOT gate on coverage %. That's a follow-up
#   once Silver-tier test coverage (#38) lands enough real tests to make a
#   threshold meaningful. Setting a floor of 0% now would be theater.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same PR — don't burn Actions minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Home Assistant's own validators — the two required for any HACS integration.
  # Cheap, fast, catches the most common "I forgot to update strings.json" bugs.
  # ---------------------------------------------------------------------------

  hassfest:
    name: HA Manifest / Strings / Translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Repository Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run HACS action
        uses: hacs/action@main
        with:
          category: integration

  # ---------------------------------------------------------------------------
  # Lint — ruff format check + ruff lint. Fast enough to always run.
  # Style config lives in pyproject.toml (created by a companion PR) so this
  # step is a no-op enforcer, not a style-decider.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff format check
        run: ruff format --check custom_components/ tests/

      - name: Ruff lint
        run: ruff check custom_components/ tests/

  # ---------------------------------------------------------------------------
  # Type check — mypy against the main integration package.
  # Not --strict yet (that's Platinum quality-scale work, tracked in #40).
  # Just runs mypy so type regressions from PRs show up immediately.
  # ---------------------------------------------------------------------------

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install mypy and stubs
        run: |
          pip install mypy
          pip install "homeassistant>=2025.1.0" numpy

      - name: Run mypy
        run: mypy custom_components/nimbus_load --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Unit tests — pytest against the tests/ tree.
  # The existing 16 test files are all solver+ML; this at least keeps them
  # green as changes land. HA-surface tests come with #37 (Bronze) and #38
  # (Silver test coverage).
  # ---------------------------------------------------------------------------

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install numpy highspy
          # Home Assistant test helpers — needed once #37/#38 land HA-surface tests
          pip install "pytest-homeassistant-custom-component"

      - name: Run pytest
        run: |
          pytest tests/ \
            --cov=custom_components/nimbus_load \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Add-on Docker build check — proves nimbus_solver_app/ still builds on both
  # architectures HA users actually run. This is one of the three self-flagged
  # unknowns in issue #44 — this workflow closes verification point 2
  # ("multi-arch Docker build genuinely succeeds") permanently.
  #
  # Does NOT push the image anywhere; that's for a future release workflow.
  # ---------------------------------------------------------------------------

  addon-build:
    name: Add-on Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU (for aarch64 emulation on amd64 runners)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on image
        uses: docker/build-push-action@v5
        with:
          context: ./nimbus_solver_app
          platforms: linux/${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}
          push: false
          tags: nimbus_solver_app:ci-${{ matrix.arch }}
          # Build args match the Supervisor's own build convention.
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
