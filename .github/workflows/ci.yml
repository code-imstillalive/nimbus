name: CI

# Stage 2 of the DevOps cycle described in issue #36.
# Every pull request runs this workflow; merge is blocked until every job is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Home Assistant's own validators — the two required for any HACS integration.
  # ---------------------------------------------------------------------------

  hassfest:
    name: HA Manifest / Strings / Translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  # HACS validation runs but is marked continue-on-error until the repo-shape
  # gaps it surfaces (see issue #49) are addressed. Removing this
  # marker is one of the deliverables of that issue.
  hacs:
    name: HACS Repository Validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Run HACS action
        uses: hacs/action@main
        with:
          category: integration

  # ---------------------------------------------------------------------------
  # Lint — ruff format check + ruff lint.
  # setup-python's cache: pip removed because there's no requirements*.txt or
  # pyproject.toml at repo root to hash. A future PR can add pyproject.toml
  # with ruff/mypy/pytest config and re-enable caching then.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff format check
        run: ruff format --check custom_components/ tests/
      - name: Ruff lint
        run: ruff check custom_components/ tests/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mypy and stubs
        run: |
          pip install mypy
          pip install "homeassistant>=2025.1.0" numpy
      - name: Run mypy
        run: mypy custom_components/nimbus_load --ignore-missing-imports

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio
          pip install numpy highspy
          pip install "pytest-homeassistant-custom-component"
      - name: Run pytest
        run: |
          pytest tests/ \
            --cov=custom_components/nimbus_load \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Add-on Docker build.
  #
  # CRITICAL: the build context MUST be the repo root, not `./nimbus_solver_app`.
  # The Dockerfile references paths outside its own directory:
  #   - COPY custom_components/nimbus_load/solver ...
  #   - COPY docs/real-world-integration/files/nimbus_solver_forecast_writer.py ...
  # Setting `context: .` gives Docker access to those paths. This is the same
  # context a real Supervisor build uses.
  # ---------------------------------------------------------------------------

  addon-build:
    name: Add-on Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build add-on image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nimbus_solver_app/Dockerfile
          platforms: linux/${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}
          push: false
          tags: nimbus_solver_app:ci-${{ matrix.arch }}
