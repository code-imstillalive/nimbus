name: CI

# Stage 2 of the DevOps cycle described in issue #36.
#
# This first pass of CI runs every check but tolerates existing tree drift.
# Rationale: the tree has never had ruff, mypy, or a HA-surface pytest run
# against it before, so a strict pass fails on ~33 mypy findings, ~27 files
# needing format, and 1 lint finding -- all of which are real work that
# belongs in follow-up PRs, not in this "add CI plumbing" PR.
#
# Advisory jobs swallow their step exit code with ` || true` so the step
# exits 0 cleanly. This is deliberately different from a plain
# `continue-on-error: true`: `continue-on-error` maps a red step outcome to
# a green step conclusion, but GitHub still surfaces the raw non-zero exit
# as a red [failure] annotation on the PR view. Piping `|| true` skips the
# non-zero exit entirely, so nothing surfaces except the step's log output,
# which is where the real information (which files need reformatting, what
# mypy/pytest actually found) lives anyway.
#
# Follow-up PRs will replace the ` || true` sink with the real strict
# invocation once each underlying issue is addressed:
#   - Lint / Format          -- DONE (#68: ruff format repo-wide + 1 F401 + 3 E402 noqa placement)
#   - Unit Tests             -- DONE (this PR: [dev] extra from #69 wired in)
#   - Type Check             -- after the 33 mypy findings are triaged (see #40 Platinum work)
#   - Add-on Build           -- after #48 fixes the Dockerfile build context
#   - HACS Validation        -- DONE via separate workflow (guarded by #51 during private-repo phase)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # STRICT: hassfest is the only check that already passes clean on the tree.
  # Every future PR is gated by this -- real HA manifest/strings/translations
  # regression is a genuine bug and should block merge.
  # ---------------------------------------------------------------------------

  hassfest:
    name: HA Manifest / Strings / Translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  # ---------------------------------------------------------------------------
  # STRICT: Version lockstep between integration and add-on.
  # custom_components/nimbus_load/manifest.json and
  # nimbus_solver_app/config.yaml MUST carry the same version string. This
  # is what lets an add-on user say "I'm on Nimbus vX.Y.Z" and mean the
  # same thing as an integration user. Drift means either a missed bump
  # in a release PR (Supervisor never offers the update) or a stray edit.
  # Both are bugs; catch them in CI.
  # ---------------------------------------------------------------------------

  version-lockstep:
    name: Version lockstep (integration <-> add-on)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Compare versions
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib
          root = pathlib.Path(".")
          m_path = root / "custom_components/nimbus_load/manifest.json"
          a_path = root / "nimbus_solver_app/config.yaml"
          m_ver = json.loads(m_path.read_text())["version"]
          m_yaml = a_path.read_text()
          match = re.search(r'^version:\s*"([^"]+)"', m_yaml, re.MULTILINE)
          if not match:
              print(f"::error file={a_path}::could not find version: line")
              sys.exit(2)
          a_ver = match.group(1)
          if m_ver != a_ver:
              print(f"::error::version drift: manifest.json={m_ver} but config.yaml={a_ver}")
              print(f"::error::both must match; see nimbus_solver_app/config.yaml header comment")
              sys.exit(1)
          print(f"OK: both at {m_ver}")
          PY

  # ---------------------------------------------------------------------------
  # STRICT: Lint (ruff format + ruff check).
  # Flipped from advisory in the same PR that ran `ruff format` repo-wide
  # and cleared the 1 F401 unused-import + 3 E402 noqa-placement findings
  # uncovered by the format pass. F841 in solver/lp.py was fixed upstream
  # in an earlier merge. Any future regression should block merge.
  # ---------------------------------------------------------------------------

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        # Pinned to match .pre-commit-config.yaml so local hooks and CI
        # enforce the same ruleset. Bumping this and the pre-commit rev
        # together is a deliberate, reviewable act.
        run: pip install "ruff==0.6.0"
      - name: Ruff format check
        run: ruff format --check custom_components/ tests/
      - name: Ruff lint
        run: ruff check custom_components/ tests/

  # ---------------------------------------------------------------------------
  # ADVISORY: Type Check (mypy).
  # 33 findings on current tree, mostly "Optional not handled" patterns in
  # solver/network.py, ml/model.py, and ml/gbrt.py. Real work, tracked as
  # part of #40 (Platinum quality-scale strict-typing).
  # ---------------------------------------------------------------------------

  typecheck:
    name: Type Check (mypy) [advisory]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install mypy
        run: pip install mypy numpy
      - name: Run mypy (advisory)
        run: mypy custom_components/nimbus_load --ignore-missing-imports || true

  # ---------------------------------------------------------------------------
  # STRICT: Unit Tests (pytest).
  # Wired via pyproject.toml's [dev] extra (#69) -- `pip install -e '.[dev]'`
  # is now the single source of truth for the test dependency set. No more
  # ad-hoc `|| true`-piped installs of pytest / numpy / highspy /
  # pytest-homeassistant-custom-component. Tests pass green from a fresh
  # venv via this path.
  #
  # Python 3.14 because that is what Home Assistant runs. Core dropped
  # 3.13 at 2026.3.0, and pytest-homeassistant-custom-component followed
  # in the same step: 0.13.316 is the last release accepting 3.13 and it
  # pins homeassistant==2026.2.3. Staying on 3.13 would test against a
  # core six releases behind the one this integration is installed on.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      # Two separate pytest invocations, on purpose.
      #
      # `pytest-homeassistant-custom-component` registers a pytest11
      # plugin named `homeassistant` via entry_points the moment it is
      # installed. Its autouse `enable_event_loop_debug` fixture then
      # applies to EVERY test in the process and calls
      # `asyncio.get_event_loop()` under HA's own event loop policy,
      # which raises `RuntimeError: There is no current event loop in
      # thread 'MainThread'`. The 320+ stub-based tests under
      # `tests/*.py` do not set up a loop, so they all error at setup.
      #
      # `--ignore` does not help: it excludes test files from
      # collection, not plugins from registration. A directory-scoped
      # `conftest.py` cannot help either, because registration is
      # process-wide and happens before conftest is read. Disabling the
      # plugin by entry-point name is what actually isolates the stub
      # suite, and a second invocation without the flag is what gives
      # the hass_integration tests the real fixtures.
      - name: Run pytest (stub-based, fast)
        run: |
          pytest tests/ --ignore=tests/hass_integration/ \
            -p no:homeassistant \
            --cov=custom_components/nimbus_load \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
      - name: Run pytest (real HA harness, hass_integration only)
        run: |
          pytest tests/hass_integration/ \
            --cov=custom_components/nimbus_load \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # HACS validation and Add-on build are deferred until #48 (Dockerfile
  # context) and #49 (HACS repo-shape gaps) land. Re-added in a follow-up
  # PR once those are addressed.
