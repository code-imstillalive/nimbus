# Diag only, never merged: name the old tests behind each gap mutant.
name: Diag mutation names
on:
  push:
    branches: [diag/mutation-names]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {module: custom_components/nimbus_load/solver/stochastic_dispatch.py, mutant: 8}
          - {module: custom_components/nimbus_load/solver/stochastic_dispatch.py, mutant: 10}
          - {module: custom_components/nimbus_load/solver/stochastic_dispatch.py, mutant: 24}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          path: new
          ref: 66b51ffbcd27f86919720f8e98efbb8b3f295830
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          path: old
          ref: 4d21159b84a3e83751a4e0a9fe1a25879d38b47c
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          path: driver
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e './new[dev]'
      - run: python driver/diag/gap_names.py ${{ matrix.module }} ${{ matrix.mutant }}
