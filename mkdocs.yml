site_name: Nimbus
site_description: Battery, solar and load optimiser for Home Assistant
site_url: https://code-imstillalive.github.io/nimbus/
repo_url: https://github.com/code-imstillalive/nimbus
repo_name: code-imstillalive/nimbus
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

# nimbus #1801: user documentation only. Development history (worklogs,
# handovers), specs, design notes and reviews stay in the repo, not on the site.
exclude_docs: |
  worklog/
  handover/
  specs/
  design/
  ivv/
  architecture/
  real-world-integration/
  code-review-*.md
  release-process.md
  reference-benchmark.md
  api-contract.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: setup-guide.md
  - Price providers:
      - Choosing a provider: providers/index.md
      - LocalVolts: providers/localvolts.md
      - Amber: providers/amber.md
      - AEMO / NEM regional forecasts: providers/aemo-nem.md
      - Any other price sensor: providers/generic.md
      - What device setup can find: providers/support-matrix.md
  - Using Nimbus:
      - Dashboard tabs: tabs.md
      - Every setting: configuration-reference.md
      - Dashboards and cards: dashboards.md
      - Controllable loads: controllable-loads.md
      - Entities: entities.md
  - Going live: going-live.md
  - Safety features: safety.md
  - Troubleshooting: troubleshooting.md
  - Testers: TESTERS.md
