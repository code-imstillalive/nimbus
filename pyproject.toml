# Nimbus repo tooling config.
#
# This file is intentionally NOT an installable Python package -- Nimbus
# is a Home Assistant custom_component (installed via HACS / Supervisor,
# not pip) plus a separate Supervisor add-on. The pyproject here exists
# for tooling only:
#
#   1. Give a fresh clone a single, reproducible dev-deps install command
#      (`pip install -e '.[dev]'`) so `pytest` runs green without inferring
#      what the CI test job installs.
#   2. Move the ruff format + lint configuration out of ad-hoc invocations
#      and into a versioned config, so local dev and CI apply the same rules.
#   3. Configure pytest's test discovery + sys.path so `tests/_solver_path.py`
#      is no longer the only way test modules can find `solver/` and `ml/`
#      under `custom_components/nimbus_load/`.
#
# The single source of truth for the release version is still
# `custom_components/nimbus_load/manifest.json` -- pyproject deliberately
# does not carry a version number to avoid two-place drift.
#
# Related: #36 (DevOps lifecycle, Stage 1), unblocks flipping the pytest CI
# job from advisory (`|| true`) to strict once #36's `pyproject.toml` step
# is complete.

[build-system]
# Required by PEP 621 even though we don't build a distribution -- keeps
# `pip install -e '.[dev]'` working.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-dev"
# Deliberately kept low and *not* synced with the HA manifest -- see header.
version = "0.0.0"
description = "Dev-tooling shim for the Nimbus Home Assistant custom_component + Supervisor add-on. Not a distributable package."
# 3.14 because Home Assistant core dropped 3.13 at 2026.3.0, and the
# [dev] extra below pulls a test harness that will not install on
# anything older. The .4 is also load-bearing: 3.14.0 through 3.14.3
# shipped a unittest.mock that inspected signatures in
# annotationlib.Format.VALUE mode, which cannot autospec recorder's
# TYPE_CHECKING-annotated functions and breaks every test under
# tests/hass_integration/. See that directory's conftest for detail.
# Declaring the floor here makes a wrong interpreter a clean resolver
# message instead of a confusing NameError from inside recorder.
requires-python = ">=3.14.4"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Raf", email = "code-imstillalive@users.noreply.github.com" }]

# Runtime deps mirror custom_components/nimbus_load/manifest.json so a
# fresh clone can actually import and unit-test the solver + ML modules.
# Kept minimal on purpose: the full HA runtime is NOT needed for the 249
# existing tests (see tests/_ha_stubs.py -- HA is stubbed).
dependencies = [
    "numpy>=1.24",
    "voluptuous>=0.13",
]

[project.optional-dependencies]
# Everything a fresh clone needs to run `pytest -q` green.
# Verified against the current tree with the base [project.dependencies]
# above: the stub suite and the real-HA harness both pass. (This comment
# read "320 stub tests plus the 9 real-HA tests" until 2026-09-15, when
# the stub suite was at 2580 -- a hardcoded count here rots the same way
# README's did, so the claim is now about passing, not about a number.)
# highspy is a hard
# import in solver/stochastic.py -- can't be optional at collection time.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # Provides the @pytest.mark.freeze_time marker that five test files
    # and one test method depend on. Declared explicitly because it was
    # arriving ONLY as a transitive dependency of
    # pytest-homeassistant-custom-component below -- which works until
    # that pin moves, and which cost a real contributor a debugging
    # detour: with the marker unattributed, the obvious candidate to
    # reach for is the ABANDONED pytest-freezegun, whose last release
    # (0.4.2) hard-fails on import on Python 3.12+
    # (`from distutils.version import LooseVersion`, removed in 3.12).
    # pytest-freezer is its maintained successor and is what actually
    # registers the marker here. Found via nimbus issue #1249's IV&V
    # pass (@purcell-lab).
    "pytest-freezer>=0.4.8",
    "ruff>=0.6",
    # docs/specs/000-golden-master-and-gates.md Part C: the mypy ratchet
    # (tests/gates/mypy_ratchet.py) shells out to `mypy` itself, and its own
    # tests (tests/test_gates_mypy_ratchet.py) need it importable to exercise
    # both the synthetic fixtures and the real repo. Pinned exactly, not
    # floored, unlike ruff/import-linter above -- .github/workflows/ci.yml's
    # own "Type Check (mypy) [advisory]" job installs mypy UNPINNED
    # (`pip install mypy numpy`), so it can drift to a newer release at any
    # time independent of any code change here; pinning the dev-extra copy
    # is what makes tests/gates/mypy_baseline.txt's own count reproducible
    # locally and in the "Unit Tests (pytest)" CI job, which is a genuinely
    # different job from the advisory typecheck one. See that baseline
    # file's own neighbour, tests/gates/mypy_ratchet.py's module docstring,
    # for the exact version/measurement this pin exists to reproduce, and
    # for why the two jobs comparing two different mypy installs is a real,
    # open limitation rather than one this PR can close by itself.
    "mypy==2.3.1",
    # docs/architecture/tech-debt-plan.md section 2 / docs/specs/000-golden-
    # master-and-gates.md Part C: enforces the plan's layer map (solver/ ->
    # solver_inputs+solver_reports -> solver_plan+solver_publish+
    # solver_dispatch -> solver_writer+standalone_writer) via the `layers`
    # contract type, configured below in [tool.importlinter]. Floored, not
    # pinned exactly, the same reasoning as ruff/pytest-freezer above --
    # there is no known cross-release behaviour gap this project has hit
    # yet, unlike pytest-homeassistant-custom-component's exact pin, which
    # exists specifically because ITS version selects a whole HA core
    # release underneath it.
    "import-linter>=2.0",
    "highspy>=1.15.1",
    # The real JSON Schema validator, for nimbus issue #495's own acceptance
    # criterion: "a record built from a synthetic solve validates against
    # telemetry.schema.json v2.0". That file is @purcell-lab's, vendored here
    # under schema/ and pinned by sha256 -- it is draft 2020-12 with a
    # top-level `additionalProperties: false`, nullable unions, per-field
    # numeric ranges and nested `items.required`, none of which voluptuous
    # (already a dependency) can consume.
    #
    # Added rather than hand-rolling a checker, deliberately: this issue's own
    # thread spent days refusing to validate against a RECONSTRUCTION of the
    # schema, on the grounds that such a test "would pass by construction and
    # prove nothing". A hand-written validator is the same failure one layer
    # down -- it would assert the record matches whatever subset of the schema
    # the validator's author happened to implement. Test-only; the shipped
    # integration imports nothing from it.
    "jsonschema>=4.23",
    # Pure-Python CSS parser (~50KB, no C deps, no browser). Added
    # 2026-09-07 for tests/frontend/test_dispatch_card_compact_layout.py
    # (issue #459, Mark Purcell): the compact phone-width layout on
    # nimbus-dispatch-card-v4.js is asserted by extracting the shadow-root
    # CSS string from the JS file and walking the parsed rule tree. Static
    # test only -- no headless browser, no visual-diff step, no CI browser
    # install. What it catches: a future edit that deletes the @container
    # block, moves the 500px breakpoint, drops table-layout: fixed, or
    # regresses the wide-format defaults. What it does NOT catch: browser
    # bugs, visual regressions inside the wide format, real-device
    # container-width edges -- those need Playwright, which nimbus does
    # not have today and did not seem worth adding for one bugfix.
    "tinycss2>=1.4",
    # Real Home Assistant test harness -- gives tests a genuine `hass`
    # fixture with a real state machine, real event loop, and
    # `async_fire_time_changed` so time-dependent behaviour can be
    # exercised deterministically. Added 2026-08-23 to lock in the
    # flap regression coverage for the two Solver push sensors (see
    # tests/hass_integration/) -- the three-release
    # chain (#82 crash, #83 flap, #85 flap-still) all lived
    # in the gap between our unit tests and real HA runtime behaviour.
    # The stub-based tests under _ha_stubs.py stay -- they exercise
    # everything that doesn't need a real state machine, and keep the
    # test-collection surface fast. This dep only comes into play for
    # the two files that specifically ASK for the real hass fixture.
    #
    # Pinned exactly, not floored. Each release of this package pins one
    # exact `homeassistant` version, so the package version IS the core
    # version under test. `>=0.13` would silently drift the core version
    # on every rebuild and, worse, resolve to 0.13.316 (core 2026.2.3)
    # on Python 3.13. 0.13.357 pins homeassistant==2026.8.3, which is
    # the core series this integration is actually installed on.
    "pytest-homeassistant-custom-component==0.13.357",
    # Real, separate PyPI package (NOT bundled by pytest-homeassistant-
    # custom-component -- confirmed missing live in CI, 2026-08-23:
    # `ERROR: Error during setup of component frontend: No module
    # named 'hass_frontend'`). HA core's own `frontend` component
    # imports `hass_frontend` (the compiled static-asset bundle) at
    # homeassistant/components/frontend/__init__.py's own
    # `_frontend_root()`, unconditionally, well before anything
    # reaches `add_extra_js_url()` -- so calling the real
    # `async_setup_component(hass, "frontend", {})` (needed to test
    # frontend.py's async_register_frontend(), which this repo's own
    # topology-card integration genuinely calls) hard-requires this
    # package to be importable, unlike almost every other custom
    # integration test, which never touches `frontend` at all.
    # Deliberately unpinned -- unlike homeassistant itself (which the
    # exact-pinned pytest-homeassistant-custom-component above needs
    # to match 1:1, since it dictates the real API surface under
    # test), our own tests never read a single actual frontend asset
    # file; we only need hass_frontend.where() to resolve to SOME
    # real, importable directory so StaticPathConfig registration
    # (a route registration, not a file existence check) succeeds.
    "home-assistant-frontend",
]

[project.urls]
Homepage = "https://github.com/code-imstillalive/nimbus"
Issues = "https://github.com/code-imstillalive/nimbus/issues"

# ---------------------------------------------------------------------------
# setuptools: this repo is NOT a Python distribution. Tell setuptools to
# find no packages so `pip install -e .` doesn't try to wheel up
# `custom_components/` (which HA installs its own way).
# ---------------------------------------------------------------------------

[tool.setuptools]
packages = []

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Path setup:
#   - custom_components/nimbus_load contains solver/ and ml/ that tests
#     import as bare `solver.xxx` / `ml.xxx`. This replaces
#     tests/_solver_path.py's manual sys.path manipulation.
#   - tests/ itself has to be importable so test modules can
#     `import _solver_path` (their existing convention).
# _solver_path.py is retained so plain `python tests/test_X.py` still
# works without pytest.
pythonpath = ["custom_components/nimbus_load", "tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # HA + numpy compatibility warnings we don't own -- keep the escape hatch
    # narrow so real regressions still surface.
    "ignore::DeprecationWarning:homeassistant.*",
    "ignore::PendingDeprecationWarning:homeassistant.*",
    # Root cause of the #92 "0 live entity instances" / "Setup failed
    # for dependencies: ['http']" CI failure (2026-08-23): HA core's own
    # stock http component does `self.app["hass"] = self.hass` (a plain
    # string key) at homeassistant/components/http/server.py:290 --
    # unrelated to anything in this repo's own diff. aiohttp (whatever
    # version pip resolves against the pinned homeassistant release;
    # neither package hard-pins the other) treats that as soft-
    # deprecated and warns NotAppKeyWarning; "error" above promotes it
    # to a hard exception, crashing http's own setup and cascading into
    # nimbus_load failing (http is a declared manifest dependency).
    #
    # nimbus issue #358 (Mark Purcell) flagged the ORIGINAL form of this
    # entry here, `"ignore::aiohttp.web_exceptions.NotAppKeyWarning"` --
    # a dotted CATEGORY path pytest resolves by importing aiohttp during
    # its own config bootstrap. aiohttp is only ever installed
    # transitively via the [dev] extra, never a base
    # [project.dependencies] requirement, so a fresh clone with only
    # `pip install -e .` aborted ALL test collection with "Failed to
    # import filter module 'aiohttp'" before a single test could run.
    #
    # Tried moving this into a tests/conftest.py pytest_configure() hook
    # instead (a plain runtime `warnings.filterwarnings()` call, guarded
    # by ImportError) -- found a real, worse regression doing that: this
    # ini list is not just applied once at startup, pytest re-applies it
    # fresh inside a warnings.catch_warnings() scope around EVERY test
    # item, which silently discards any filter registered globally via
    # a conftest hook the moment the first real test runs. Confirmed
    # live: the "real HA harness" CI job (which, unlike the stub job,
    # actually executes http's real async_initialize()) started failing
    # 9 tests with exactly the original #92 crash once the ini entry was
    # removed in favour of the conftest hook.
    #
    # The actual fix: filter by MESSAGE instead of dotted CATEGORY path.
    # pytest's own filterwarnings syntax accepts `action:message:...`
    # with the category/module/lineno fields left blank, matched via a
    # plain regex against the warning's message string -- no import of
    # anything required to parse or apply it, so this is immune to both
    # problems above (fresh-clone collection abort, and getting silently
    # dropped by pytest's own per-test filter re-application, since it's
    # a real ini entry again, not a conftest-level side effect).
    "ignore:It is recommended to use web.AppKey instances for keys:",
    # Found live in CI (2026-09-06, #364's dashboard-cards PR) -- a SECOND,
    # differently-worded instance of the exact same warning class as the
    # entry directly above, from a different HA core file this time:
    # `homeassistant/components/http/ban.py`'s `ban_middleware` calls
    # `is_supervisor_unix_socket_request(request)`, which does
    # `request[KEY_SUPERVISOR_UNIX_SOCKET] = result` -- a plain (non-
    # `web.RequestKey`) dict key on the per-request mapping, unrelated to
    # the per-APP `app["hass"]` key the entry above covers. aiohttp's
    # warning text differs accordingly ("web.RequestKey instances" not
    # "web.AppKey instances"), so the existing message-regex doesn't
    # match it and "error" above promoted it to a hard 500 the first time
    # any test in this suite made a real HTTP request through the FULL
    # middleware stack (`ban_middleware` only runs for a genuine incoming
    # request -- nothing before tests/hass_integration/test_frontend_
    # cards_registered.py's own `hass_client()` calls ever exercised it).
    # Same fix, same reasoning as above -- filter by message, not
    # category, for the same fresh-clone-collection and per-test-
    # re-application reasons documented in that entry's own comment.
    "ignore:It is recommended to use web.RequestKey instances for keys:",
    # Found live in CI (2026-09-05, v0.94.101), reproduced deterministically
    # on a rerun -- NOT a flake, and not owned by this repo's own code.
    # `tests/test_solver_soft_min_soc_constraint.py` (a plain solver LP
    # test with zero tempfile usage of its own) failed with
    # `pytest.PytestUnraisableExceptionWarning: Exception ignored while
    # calling deallocator <function _TemporaryFileCloser.__del__ ...>:
    # None`, only on CI's Python 3.14.7 (never reproduced locally on
    # 3.12.10) -- a garbage-collected, never-explicitly-closed temp file
    # object (almost certainly created deep inside `highspy`/HiGHS's own
    # C-extension internals during an EARLIER test's solve, not this
    # test's own code) happening to get finalized while this
    # unrelated, later test is executing. Confirmed test-order-dependent,
    # not this test's own fault: `filterwarnings = ["error"]` above
    # promotes pytest's own GC-timing-driven warning into a hard failure
    # wherever in the suite it happens to land, exactly the same
    # "dependency's own internal housekeeping, not a real regression in
    # our diff" shape as the aiohttp entry above.
    "ignore:Exception ignored while calling deallocator",
]

# ---------------------------------------------------------------------------
# ruff
#
# Deliberately minimal: this PR pins ruff for reproducibility (via the
# [dev] extra) and sets target-version so pyupgrade-style checks don't
# guess. It does NOT change what CI enforces today -- the ruff format +
# ruff check invocations in .github/workflows/ci.yml already passed at
# PR #68 merge, and expanding the ruleset now would silently reintroduce
# lint failures on main. Rule-set expansion (I / UP / B, wider line-length,
# etc.) belongs in its own PR where the diff is reviewable.
# ---------------------------------------------------------------------------

[tool.ruff]
# nimbus issue #358 (Mark Purcell): flagged that this says "py312" while
# requires-python above says ">=3.14.4" and CI/tests pin
# homeassistant==2026.8.3 (which runs 3.14). Tried bumping this to
# "py314" and found a real reason NOT to, worth recording: ruff's
# formatter treats target-version >=3.14 as license to rewrite every
# multi-exception `except (A, B):` into PEP 758's new unparenthesized
# `except A, B:` form, which is a SyntaxError on any Python before 3.14
# -- this project's own local dev workflow (tests/run_all.py, direct
# pytest/unittest invocations) runs on whatever Python is actually
# installed on the machine, not necessarily 3.14 yet. Bumping this
# would silently make the whole tree unparseable locally the moment
# ruff format ever ran, while still passing CI (which does run 3.14) --
# exactly the kind of gap a "just match requires-python" fix can open
# without also confirming every real local dev environment is already
# on the same interpreter version. Left at py312 deliberately until
# local dev environments are confirmed on 3.14 too.
#
# Mark Purcell, closing #358: `requires-python` above describes the HA
# runtime this integration actually ships against; `target-version` here
# describes the lowest interpreter a CONTRIBUTOR may run locally to edit
# this code. The mismatch is intentional, not an oversight -- see the
# comment block above for why raising it breaks a 3.12 checkout.
target-version = "py312"
extend-exclude = [
    "__pycache__",
    "build",
    "dist",
]

# 2026-08-23 (#72 Stage 1): ruff bumped 0.6.0 -> 0.16.4. The default
# ruleset itself expanded meaningfully across those 10 minor releases --
# 149 new findings on this tree, none present at 0.6.0. Stage 1's own
# job was the mechanical, zero-behaviour-change auto-fixes (108 of them,
# already applied+committed); everything below needs a real per-site
# judgment call (narrow an except, decide if a naive datetime is
# intentional, etc.), so #72's own staged plan works through each rule
# FAMILY as its own reviewable PR (Stage 2: BLE001/DTZ001/S110/C408;
# Stage 3: the 6 singleton rules) rather than one unreviewable dump.
#
# Ignored here ONLY as a temporary staging device so CI stays green
# between Stage 1 landing and each Stage 2/3 PR clearing its own rule --
# every entry below is removed the moment its own PR lands, not kept
# permanently. Do not add a new rule to this list for any reason other
# than "it's a real #72 Stage 2/3 item queued for its own PR."
[tool.ruff.lint]
ignore = [
    # BLE001 (blind-except, 28 findings) done, 2026-08-23: every real
    # site in custom_components/nimbus_load/ and the portable script copy
    # (docs/real-world-integration/files/ -- nimbus_solver_app/ carried a
    # third copy of the same script until it was removed in #357) now
    # carries its own individual `# noqa: BLE001 -- <reason>` -- see the
    # per-file-ignores block below for the one remaining category
    # (test-collector boilerplate) that's a deliberate pattern repeated
    # across 23 files, not 23 separate judgment calls.
    # DTZ001 (call-datetime-without-tzinfo, 8 findings) done, 2026-08-23:
    # all 8 real sites (tests/, synthetic PeriodGrid.start anchors) now
    # carry an explicit UTC tzinfo, closing a real (if narrow) fidelity
    # gap versus production (real PeriodGrid.start values are genuinely
    # tz-aware) that a naive datetime never caught, since every site
    # compared naive-to-naive consistently within its own file.
    # S110 (try-except-pass, 3 findings) done, 2026-08-23: the 3 real
    # sites (all a notification/sentinel-write failure that must never
    # block the real, more important operation) each now carry a
    # combined `# noqa: BLE001, S110 -- <reason>` -- same 3 lines
    # BLE001 already touched, one shared reason covers both rules'
    # concerns (don't catch too broadly / don't silently discard with
    # no logging).
    # C408 (unnecessary-collection-call, 12 findings) done, 2026-08-23:
    # all 12 were the identical, genuinely safe pattern -- a test
    # fixture helper's own `defaults = dict(key=val, ...)` (every key
    # a plain identifier, no **kwargs spread, no duplicate-key risk) --
    # rewritten to a literal via `ruff check --fix --unsafe-fixes`
    # (ruff's own generic conservative default for this rule family,
    # not a sign any of these 12 specific sites carried real risk;
    # confirmed via diff -- purely mechanical, zero semantic change).
    # Stage 3 (all 6 singleton rules) done, 2026-08-23, same pass:
    #   EXE001 (shebang-not-executable): a real, live CI failure caught
    #     the exact opposite of what local verification on Windows had
    #     shown -- ruff's EXE001 check reads the real OS-level
    #     executable bit, which Windows/Git-Bash can't meaningfully
    #     represent, so a whole-repo `ruff check --select EXE001 .`
    #     run locally silently false-negatived on all 3 real shebang'd
    #     files (solver_writer.py + its two portable copies, all
    #     tracked as mode 100644/non-executable in git despite the
    #     shebang) -- CI's own Linux checkout materializes the real
    #     git-tracked mode, which is what actually caught this. Fixed
    #     for real via `git update-index --chmod=+x` on all 3 (matching
    #     each file's own genuine `if __name__ == "__main__":` block --
    #     these really are meant to be runnable standalone, not just
    #     importable), not just the one CI verified.
    #   FURB162 (fromisoformat-replace-z): every real site (11 total,
    #     including 10 out-of-CI-scope ones in docs/real-world-
    #     integration/files/ not counted in #72's original 1-finding
    #     scope) was the identical `datetime.fromisoformat(s.replace(
    #     "Z", "+00:00"))` -- verified locally that Python 3.11+'s
    #     fromisoformat() natively parses a trailing "Z" and produces a
    #     byte-identical result, so the .replace() call was genuinely
    #     redundant everywhere it appeared, not just in the one CI-scope
    #     site.
    #   PLW1510 (subprocess-run-without-check): 4 real sites (all out of
    #     CI scope, docs/real-world-integration/files/), each given a
    #     genuine per-site call: 3 already relied on inspecting stdout
    #     directly with no exception-based error handling, so check=
    #     False makes that explicit; the 4th (nimbus_solver_quality_
    #     writer.py) sits inside a try/except that already explicitly
    #     names subprocess.SubprocessError -- that branch was dead code
    #     without check=True, so True is what the existing except
    #     clause's own intent actually needs.
    #   RUF012 (mutable-class-default): the one real site (tests/
    #     _ha_stubs.py's _TO_WATTS lookup table) annotated ClassVar,
    #     matching ruff's own recommended pattern for a genuinely
    #     intentional shared read-only class attribute.
    #   SIM103 (needless-bool): the one real site (sensor.py's
    #     `available` property) collapsed to a direct negated-condition
    #     return, logically identical.
    #   RUF059 (unused-unpacked-variable): all 5 real sites (docs/real-
    #     world-integration/files/lovelace_add_nimbus_*.py) were the
    #     identical `view, section, card = find_view_with_entity(...)`
    #     with only `card` genuinely unused each time -- renamed to
    #     `_card`, standard convention, `view`/`section` both confirmed
    #     used afterward in every file before renaming.
    #
    # #72's own entire ruff 0.6.0->0.16.4 backlog (BLE001/DTZ001/S110/
    # C408 Stage 2 + all 6 Stage 3 singletons) is now fully resolved --
    # this list is intentionally empty of real rule codes. Real gotcha
    # hit landing this: PRs #95/#96/#98 merged close together, each
    # based on a slightly different prior version of this exact array
    # -- git's own line-based 3-way merge briefly left "DTZ001"/"C408"
    # reintroduced on main even after their own PRs had already fixed
    # the real code, confirmed harmless at the time (`ruff check
    # --select DTZ001 --config "lint.ignore=[]"` found zero real
    # findings) but a real, demonstrated way several PRs touching the
    # SAME small list can silently un-fix each other's own bookkeeping.
]

# nimbus issue #1301 (Phase 2a, spec 001, #1347): `_LOGGER` moved from a
# direct `_LOGGER = logging.getLogger(__name__)` assignment in
# solver_writer.py to a genuine identity alias re-exported from the new
# solver_shared.py (`from .solver_shared import (..., _LOGGER, ...)`).
# Ruff's BLE001 (blind-except) rule exempts an `except Exception:` block
# whose body logs via a real `logging.Logger` with `exc_info` set -- but it
# can only recognise that FOR FREE when the logger is a direct `logging.
# getLogger(...)` call it can see in the same file. Once `_LOGGER` is an
# imported name, ruff's static check loses that trail and 19 real,
# unrelated, pre-existing `except Exception:` blocks in solver_writer.py
# (each already correct -- `_LOGGER.debug(..., exc_info=True)` or `.
# warning(...)`, same as before this move, zero behaviour change) started
# reading as newly-blind, purely because of where `_LOGGER` is now bound,
# confirmed by a real base-vs-head `ruff check --select BLE001` run (0
# findings on solver_writer.py at 7a3187e, 19 at this branch's tip, for
# byte-identical try/except bodies). `logger-objects` is ruff's own
# documented mechanism for exactly this shape ("projects that re-export a
# `logging.Logger` object from a common module") -- not a suppression, a
# correction of ruff's own logger-identity tracking to match reality.
logger-objects = ["custom_components.nimbus_load.solver_shared._LOGGER"]

# nimbus issue #360 (Mark Purcell, codebase review): the BLE001
# per-file-ignore that used to sit here existed ONLY for the identical
# `if __name__ == "__main__":` bare-function collector every test_*.py
# file used to end with (run each test_* function directly, catch
# AssertionError separately from any other Exception) -- pytest is now
# the sole runner (tests/run_all.py deleted, every one of those
# collector blocks removed), so that pattern, and the exemption it
# needed, no longer exist. Removing this surfaced zero real BLE001
# findings elsewhere in tests/ -- confirmed via a plain `ruff check
# tests/` with this ignore removed, not assumed.
# ---------------------------------------------------------------------------
# import-linter -- docs/architecture/tech-debt-plan.md section 2 / docs/
# specs/000-golden-master-and-gates.md Part C ("import-linter contracts",
# specified there, built here). Run via `tests/test_import_linter_contract.py`
# (wraps `lint-imports` in a pytest assertion, the same "static analysis
# wrapped in a pytest assertion" house style tests/test_docs_writer_
# function_set_drift.py already uses for a different static check), and
# proven on synthetic fixtures in tests/test_gates_import_linter.py.
#
# root_packages = ["custom_components"]: `custom_components` itself has no
# `__init__.py` (a namespace package, same as it is at runtime under a real
# HA install) -- `custom_components.nimbus_load` is the real package
# underneath it. `containers` below scopes every layer tail to that package
# alone, so `lint-imports` never reaches into `tests/` or anywhere else.
#
# The layer order matches the plan's section 2 exactly, but INVERTED: the
# plan lists `solver/` first as item 1 ("pure LP and maths") and
# `solver_writer.py` last as item 5 ("façade and orchestration"), which
# reads top-to-bottom as *lowest-to-highest* in dependency terms --
# solver_writer is the orchestrator that calls into everything else, so it
# sits at the TOP of the real dependency stack even though it is last in
# the plan's own numbered list. import-linter's own `layers` field is
# documented the other way (highest layer first, and "higher layers may
# depend on lower layers, but not the other way around"), so this list
# runs plan-item-5 down to plan-item-1.
#
# Parenthesised entries ((standalone_writer), (solver_plan), (solver_
# dispatch), (solver_reports)) are modules the plan names for a LATER
# phase (see the plan's own section 4 sequence table) that do not exist
# yet -- import-linter's own docs: "You can make a layer optional by
# wrapping it in parentheses," which is exactly what a not-yet-built
# target layer needs, so the contract does not fail today merely because
# Phase 4-7's modules don't exist, but starts enforcing the moment each
# one is created.
#
# Deliberately NOT included: `solver/ha_bridge.py` (the plan's own item 4,
# "implements the protocols"). Measured directly, not guessed: declaring
# it as a layer nested inside `solver` (the plan's item 1, also a
# declared layer here) makes import-linter refuse the whole contract with
# "Modules have shared descendants" -- confirmed by creating a throwaway
# `solver/ha_bridge.py` locally and running `lint-imports` against this
# exact config, both with the file present (immediate refusal) and absent
# (passes silently, which is the trap: an `(optional)` layer that doesn't
# exist yet hides this failure until Phase 7 actually creates the file).
# A layer cannot be a subpackage of another declared layer in this
# contract type. Phase 7's own spec needs to pick one of: moving
# `ha_bridge.py` out of `solver/` to a top-level sibling module (so it CAN
# be its own layer, the same shape as `solver_writer.py`), or protecting
# the same invariant with a second, narrower contract (e.g. `forbidden`)
# once the file exists. Not resolved here -- Phase 7 is not this PR's
# scope, and inventing a fix for a module that doesn't exist yet risks
# shipping something nobody has verified against the real file.
#
# ignore_imports below: the plan's own section 1 table originally recorded
# seven `_solver_writer()` late-import call sites, confirmed current by
# re-running `lint-imports` against this contract with NO ignore_imports
# at all -- it reported exactly these seven `importer -> imported` edges
# and no others (`solver_inputs.battery_soc`/`prices`/`load`/`solar`/
# `extra_batteries`/`battery_participants` and `solver_publish`, each
# importing `solver_writer`), matching the plan's table exactly.
#
# nimbus issue #1301 (Phase 2, spec 001, #1347): a draft of this spec
# expected six of those seven to be retirable here -- the six `solver_
# inputs/*.py` modules repoint their own `_LOGGER` access onto
# `solver_shared` instead of reaching into `solver_writer` for it. That
# repointing is real (see each module's own `from .. import solver_shared`
# and its `solver_shared._LOGGER` call sites) and is a genuine, permanent
# reduction in what those six modules depend on `solver_writer` for. But
# re-running `lint-imports` with the exceptions removed, rather than
# assuming the repoint was sufficient, showed all six edges UNCHANGED --
# each of the six still has its own pre-existing `_solver_writer()` seam
# for OTHER names spec 001 never touched (e.g. `sw.fetch_entity_power_
# history_kw`, `sw._NATIVE_HASS`, `sw.build_extra_batteries`'s own
# ConfigSubentries reads, `sw.aemo_crosscheck`) -- `_LOGGER` was never the
# ONLY reason any of the six imports `solver_writer`, only one of several.
# Retargeting every remaining `sw.<name>` call site in these six files
# (splitting each into "moved to solver_shared, import directly" vs.
# "still solver_writer-only, keep the deferred seam") is a materially
# larger, higher-risk change than this spec's own stated scope, and is
# left as real, disclosed follow-up work rather than attempted here under
# a deadline. All seven original exceptions therefore stay, verified
# against a real `lint-imports` run with zero `ignore_imports` (below),
# not assumed from the plan's own table.
#
# One new exception is added: `solver_shared -> solver_writer`, for the
# identical, spec-001-documented reason `_NATIVE_HASS`/`HA_BASE`/
# `_load_token()` stay behind in `solver_writer.py` and are read via the
# same deferred `_solver_writer()` seam (nimbus issue #861) -- this is the
# one new late-import call site the spec's own Migration explicitly
# authorises, not an oversight.
#
# `unmatched_ignore_imports_alerting` is left at its default (`error`), so
# if any one of these eight imports is ever fixed for real, this contract
# starts failing with "no matching import" until the now-stale exception
# is removed -- the exceptions list can only shrink honestly, never rot
# silently the way a stale `# noqa` can.
[tool.importlinter]
root_packages = ["custom_components"]

[[tool.importlinter.contracts]]
id = "nimbus-layers"
name = "Nimbus solver layer map (tech-debt plan section 2)"
type = "layers"
containers = ["custom_components.nimbus_load"]
layers = [
    "solver_writer | (standalone_writer)",
    "(solver_plan) | solver_publish | (solver_dispatch)",
    "solver_inputs | (solver_reports)",
    "solver_shared",
    "solver",
]
ignore_imports = [
    "custom_components.nimbus_load.solver_inputs.battery_participants -> custom_components.nimbus_load.solver_writer",
    "custom_components.nimbus_load.solver_inputs.solar -> custom_components.nimbus_load.solver_writer",
    "custom_components.nimbus_load.solver_inputs.battery_soc -> custom_components.nimbus_load.solver_writer",
    "custom_components.nimbus_load.solver_inputs.extra_batteries -> custom_components.nimbus_load.solver_writer",
    "custom_components.nimbus_load.solver_inputs.load -> custom_components.nimbus_load.solver_writer",
    "custom_components.nimbus_load.solver_inputs.prices -> custom_components.nimbus_load.solver_writer",
    # nimbus issue #768: the controllable-load delivery reconstruction reaches
    # back through the same deferred, by-module seam as every sibling above.
    "custom_components.nimbus_load.solver_inputs.controllable_load_history -> custom_components.nimbus_load.solver_writer",
    "custom_components.nimbus_load.solver_publish -> custom_components.nimbus_load.solver_writer",
    "custom_components.nimbus_load.solver_shared -> custom_components.nimbus_load.solver_writer",
]
