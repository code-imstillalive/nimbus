# Nimbus repo tooling config.
#
# This file is intentionally NOT an installable Python package -- Nimbus
# is a Home Assistant custom_component (installed via HACS / Supervisor,
# not pip) plus a separate Supervisor add-on. The pyproject here exists
# for tooling only:
#
#   1. Give a fresh clone a single, reproducible dev-deps install command
#      (`pip install -e '.[dev]'`) so `pytest` runs green without inferring
#      what the CI test job installs.
#   2. Move the ruff format + lint configuration out of ad-hoc invocations
#      and into a versioned config, so local dev and CI apply the same rules.
#   3. Configure pytest's test discovery + sys.path so `tests/_solver_path.py`
#      is no longer the only way test modules can find `solver/` and `ml/`
#      under `custom_components/nimbus_load/`.
#
# The single source of truth for the release version is still
# `custom_components/nimbus_load/manifest.json` -- pyproject deliberately
# does not carry a version number to avoid two-place drift.
#
# Related: #36 (DevOps lifecycle, Stage 1), unblocks flipping the pytest CI
# job from advisory (`|| true`) to strict once #36's `pyproject.toml` step
# is complete.

[build-system]
# Required by PEP 621 even though we don't build a distribution -- keeps
# `pip install -e '.[dev]'` working.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-dev"
# Deliberately kept low and *not* synced with the HA manifest -- see header.
version = "0.0.0"
description = "Dev-tooling shim for the Nimbus Home Assistant custom_component + Supervisor add-on. Not a distributable package."
# 3.14 because Home Assistant core dropped 3.13 at 2026.3.0, and the
# [dev] extra below pulls a test harness that will not install on
# anything older. The .4 is also load-bearing: 3.14.0 through 3.14.3
# shipped a unittest.mock that inspected signatures in
# annotationlib.Format.VALUE mode, which cannot autospec recorder's
# TYPE_CHECKING-annotated functions and breaks every test under
# tests/hass_integration/. See that directory's conftest for detail.
# Declaring the floor here makes a wrong interpreter a clean resolver
# message instead of a confusing NameError from inside recorder.
requires-python = ">=3.14.4"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Raf", email = "code-imstillalive@users.noreply.github.com" }]

# Runtime deps mirror custom_components/nimbus_load/manifest.json so a
# fresh clone can actually import and unit-test the solver + ML modules.
# Kept minimal on purpose: the full HA runtime is NOT needed for the 249
# existing tests (see tests/_ha_stubs.py -- HA is stubbed).
dependencies = [
    "numpy>=1.24",
    "voluptuous>=0.13",
]

[project.optional-dependencies]
# Everything a fresh clone needs to run `pytest -q` green.
# Verified against the current tree with the base [project.dependencies]
# above: 320 stub tests plus the 9 real-HA tests pass. highspy is a hard
# import in solver/stochastic.py -- can't be optional at collection time.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "highspy>=1.15.1",
    # Real Home Assistant test harness -- gives tests a genuine `hass`
    # fixture with a real state machine, real event loop, and
    # `async_fire_time_changed` so time-dependent behaviour can be
    # exercised deterministically. Added 2026-08-23 to lock in the
    # flap regression coverage for the two Solver push sensors (see
    # tests/hass_integration/) -- the three-release
    # chain (#82 crash, #83 flap, #85 flap-still) all lived
    # in the gap between our unit tests and real HA runtime behaviour.
    # The stub-based tests under _ha_stubs.py stay -- they exercise
    # everything that doesn't need a real state machine, and keep the
    # test-collection surface fast. This dep only comes into play for
    # the two files that specifically ASK for the real hass fixture.
    #
    # Pinned exactly, not floored. Each release of this package pins one
    # exact `homeassistant` version, so the package version IS the core
    # version under test. `>=0.13` would silently drift the core version
    # on every rebuild and, worse, resolve to 0.13.316 (core 2026.2.3)
    # on Python 3.13. 0.13.357 pins homeassistant==2026.8.3, which is
    # the core series this integration is actually installed on.
    "pytest-homeassistant-custom-component==0.13.357",
    # Real, separate PyPI package (NOT bundled by pytest-homeassistant-
    # custom-component -- confirmed missing live in CI, 2026-08-23:
    # `ERROR: Error during setup of component frontend: No module
    # named 'hass_frontend'`). HA core's own `frontend` component
    # imports `hass_frontend` (the compiled static-asset bundle) at
    # homeassistant/components/frontend/__init__.py's own
    # `_frontend_root()`, unconditionally, well before anything
    # reaches `add_extra_js_url()` -- so calling the real
    # `async_setup_component(hass, "frontend", {})` (needed to test
    # frontend.py's async_register_frontend(), which this repo's own
    # topology-card integration genuinely calls) hard-requires this
    # package to be importable, unlike almost every other custom
    # integration test, which never touches `frontend` at all.
    # Deliberately unpinned -- unlike homeassistant itself (which the
    # exact-pinned pytest-homeassistant-custom-component above needs
    # to match 1:1, since it dictates the real API surface under
    # test), our own tests never read a single actual frontend asset
    # file; we only need hass_frontend.where() to resolve to SOME
    # real, importable directory so StaticPathConfig registration
    # (a route registration, not a file existence check) succeeds.
    "home-assistant-frontend",
]

[project.urls]
Homepage = "https://github.com/code-imstillalive/nimbus"
Issues = "https://github.com/code-imstillalive/nimbus/issues"

# ---------------------------------------------------------------------------
# setuptools: this repo is NOT a Python distribution. Tell setuptools to
# find no packages so `pip install -e .` doesn't try to wheel up
# `custom_components/` (which HA installs its own way).
# ---------------------------------------------------------------------------

[tool.setuptools]
packages = []

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Path setup:
#   - custom_components/nimbus_load contains solver/ and ml/ that tests
#     import as bare `solver.xxx` / `ml.xxx`. This replaces
#     tests/_solver_path.py's manual sys.path manipulation.
#   - tests/ itself has to be importable so test modules can
#     `import _solver_path` (their existing convention).
# _solver_path.py is retained so plain `python tests/test_X.py` still
# works without pytest.
pythonpath = ["custom_components/nimbus_load", "tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    # HA + numpy compatibility warnings we don't own -- keep the escape hatch
    # narrow so real regressions still surface.
    "ignore::DeprecationWarning:homeassistant.*",
    "ignore::PendingDeprecationWarning:homeassistant.*",
    # The aiohttp.web_exceptions.NotAppKeyWarning ignore (root cause:
    # #92's "0 live entity instances" CI failure) used to live here as a
    # dotted-path ignore entry -- but nimbus issue #358 (Mark Purcell):
    # resolving a THIRD-PARTY dotted warning-category path here happens
    # during pytest's own config bootstrap, which imports aiohttp to do
    # it. aiohttp is only ever installed transitively via the [dev]
    # extra's homeassistant/pytest-homeassistant-custom-component deps,
    # never a base [project.dependencies] requirement -- a fresh clone
    # with only `pip install -e .` (no [dev]) aborts ALL test collection
    # with "Failed to import filter module 'aiohttp'" before a single
    # test runs. Moved to tests/conftest.py's own pytest_configure hook
    # (guarded by a plain ImportError catch) so it degrades to a no-op
    # instead of a hard abort when aiohttp genuinely isn't installed --
    # see that hook's own docstring for the full story.
]

# ---------------------------------------------------------------------------
# ruff
#
# Deliberately minimal: this PR pins ruff for reproducibility (via the
# [dev] extra) and sets target-version so pyupgrade-style checks don't
# guess. It does NOT change what CI enforces today -- the ruff format +
# ruff check invocations in .github/workflows/ci.yml already passed at
# PR #68 merge, and expanding the ruleset now would silently reintroduce
# lint failures on main. Rule-set expansion (I / UP / B, wider line-length,
# etc.) belongs in its own PR where the diff is reviewable.
# ---------------------------------------------------------------------------

[tool.ruff]
# nimbus issue #358 (Mark Purcell): flagged that this says "py312" while
# requires-python above says ">=3.14.4" and CI/tests pin
# homeassistant==2026.8.3 (which runs 3.14). Tried bumping this to
# "py314" and found a real reason NOT to, worth recording: ruff's
# formatter treats target-version >=3.14 as license to rewrite every
# multi-exception `except (A, B):` into PEP 758's new unparenthesized
# `except A, B:` form, which is a SyntaxError on any Python before 3.14
# -- this project's own local dev workflow (tests/run_all.py, direct
# pytest/unittest invocations) runs on whatever Python is actually
# installed on the machine, not necessarily 3.14 yet. Bumping this
# would silently make the whole tree unparseable locally the moment
# ruff format ever ran, while still passing CI (which does run 3.14) --
# exactly the kind of gap a "just match requires-python" fix can open
# without also confirming every real local dev environment is already
# on the same interpreter version. Left at py312 deliberately until
# local dev environments are confirmed on 3.14 too.
target-version = "py312"
extend-exclude = [
    "__pycache__",
    "build",
    "dist",
]

# 2026-08-23 (#72 Stage 1): ruff bumped 0.6.0 -> 0.16.4. The default
# ruleset itself expanded meaningfully across those 10 minor releases --
# 149 new findings on this tree, none present at 0.6.0. Stage 1's own
# job was the mechanical, zero-behaviour-change auto-fixes (108 of them,
# already applied+committed); everything below needs a real per-site
# judgment call (narrow an except, decide if a naive datetime is
# intentional, etc.), so #72's own staged plan works through each rule
# FAMILY as its own reviewable PR (Stage 2: BLE001/DTZ001/S110/C408;
# Stage 3: the 6 singleton rules) rather than one unreviewable dump.
#
# Ignored here ONLY as a temporary staging device so CI stays green
# between Stage 1 landing and each Stage 2/3 PR clearing its own rule --
# every entry below is removed the moment its own PR lands, not kept
# permanently. Do not add a new rule to this list for any reason other
# than "it's a real #72 Stage 2/3 item queued for its own PR."
[tool.ruff.lint]
ignore = [
    # BLE001 (blind-except, 28 findings) done, 2026-08-23: every real
    # site in custom_components/nimbus_load/ and the two portable script
    # copies (docs/real-world-integration/files/, nimbus_solver_app/) now
    # carries its own individual `# noqa: BLE001 -- <reason>` -- see the
    # per-file-ignores block below for the one remaining category
    # (test-collector boilerplate) that's a deliberate pattern repeated
    # across 23 files, not 23 separate judgment calls.
    # DTZ001 (call-datetime-without-tzinfo, 8 findings) done, 2026-08-23:
    # all 8 real sites (tests/, synthetic PeriodGrid.start anchors) now
    # carry an explicit UTC tzinfo, closing a real (if narrow) fidelity
    # gap versus production (real PeriodGrid.start values are genuinely
    # tz-aware) that a naive datetime never caught, since every site
    # compared naive-to-naive consistently within its own file.
    # S110 (try-except-pass, 3 findings) done, 2026-08-23: the 3 real
    # sites (all a notification/sentinel-write failure that must never
    # block the real, more important operation) each now carry a
    # combined `# noqa: BLE001, S110 -- <reason>` -- same 3 lines
    # BLE001 already touched, one shared reason covers both rules'
    # concerns (don't catch too broadly / don't silently discard with
    # no logging).
    # C408 (unnecessary-collection-call, 12 findings) done, 2026-08-23:
    # all 12 were the identical, genuinely safe pattern -- a test
    # fixture helper's own `defaults = dict(key=val, ...)` (every key
    # a plain identifier, no **kwargs spread, no duplicate-key risk) --
    # rewritten to a literal via `ruff check --fix --unsafe-fixes`
    # (ruff's own generic conservative default for this rule family,
    # not a sign any of these 12 specific sites carried real risk;
    # confirmed via diff -- purely mechanical, zero semantic change).
    # Stage 3 (all 6 singleton rules) done, 2026-08-23, same pass:
    #   EXE001 (shebang-not-executable): a real, live CI failure caught
    #     the exact opposite of what local verification on Windows had
    #     shown -- ruff's EXE001 check reads the real OS-level
    #     executable bit, which Windows/Git-Bash can't meaningfully
    #     represent, so a whole-repo `ruff check --select EXE001 .`
    #     run locally silently false-negatived on all 3 real shebang'd
    #     files (solver_writer.py + its two portable copies, all
    #     tracked as mode 100644/non-executable in git despite the
    #     shebang) -- CI's own Linux checkout materializes the real
    #     git-tracked mode, which is what actually caught this. Fixed
    #     for real via `git update-index --chmod=+x` on all 3 (matching
    #     each file's own genuine `if __name__ == "__main__":` block --
    #     these really are meant to be runnable standalone, not just
    #     importable), not just the one CI verified.
    #   FURB162 (fromisoformat-replace-z): every real site (11 total,
    #     including 10 out-of-CI-scope ones in docs/real-world-
    #     integration/files/ not counted in #72's original 1-finding
    #     scope) was the identical `datetime.fromisoformat(s.replace(
    #     "Z", "+00:00"))` -- verified locally that Python 3.11+'s
    #     fromisoformat() natively parses a trailing "Z" and produces a
    #     byte-identical result, so the .replace() call was genuinely
    #     redundant everywhere it appeared, not just in the one CI-scope
    #     site.
    #   PLW1510 (subprocess-run-without-check): 4 real sites (all out of
    #     CI scope, docs/real-world-integration/files/), each given a
    #     genuine per-site call: 3 already relied on inspecting stdout
    #     directly with no exception-based error handling, so check=
    #     False makes that explicit; the 4th (nimbus_solver_quality_
    #     writer.py) sits inside a try/except that already explicitly
    #     names subprocess.SubprocessError -- that branch was dead code
    #     without check=True, so True is what the existing except
    #     clause's own intent actually needs.
    #   RUF012 (mutable-class-default): the one real site (tests/
    #     _ha_stubs.py's _TO_WATTS lookup table) annotated ClassVar,
    #     matching ruff's own recommended pattern for a genuinely
    #     intentional shared read-only class attribute.
    #   SIM103 (needless-bool): the one real site (sensor.py's
    #     `available` property) collapsed to a direct negated-condition
    #     return, logically identical.
    #   RUF059 (unused-unpacked-variable): all 5 real sites (docs/real-
    #     world-integration/files/lovelace_add_nimbus_*.py) were the
    #     identical `view, section, card = find_view_with_entity(...)`
    #     with only `card` genuinely unused each time -- renamed to
    #     `_card`, standard convention, `view`/`section` both confirmed
    #     used afterward in every file before renaming.
    #
    # #72's own entire ruff 0.6.0->0.16.4 backlog (BLE001/DTZ001/S110/
    # C408 Stage 2 + all 6 Stage 3 singletons) is now fully resolved --
    # this list is intentionally empty of real rule codes. Real gotcha
    # hit landing this: PRs #95/#96/#98 merged close together, each
    # based on a slightly different prior version of this exact array
    # -- git's own line-based 3-way merge briefly left "DTZ001"/"C408"
    # reintroduced on main even after their own PRs had already fixed
    # the real code, confirmed harmless at the time (`ruff check
    # --select DTZ001 --config "lint.ignore=[]"` found zero real
    # findings) but a real, demonstrated way several PRs touching the
    # SAME small list can silently un-fix each other's own bookkeeping.
]

# BLE001 in tests/test_*.py (23 sites, 2026-08-23): every one of these
# files ends with the identical `if __name__ == "__main__":` bare-function
# collector -- run each test_* function, catch AssertionError separately
# (a real test failure) from any other Exception (report as ERROR, not
# FAIL, same distinction pytest itself makes internally). This IS the
# test framework's own top-level safety net for this file, deliberately
# built to catch anything so one broken test can't take the whole
# collector down mid-run -- the same reasoning that justifies pytest's
# and unittest's own internal blind excepts, which ruff doesn't flag
# because they're stdlib. A per-file-ignore here reflects one deliberate,
# repeated pattern, not 23 independent judgment calls -- see
# tests/run_all.py's own single BLE001 site (a different, real per-site
# case: an import-time probe) for the individually-reasoned alternative.
[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["BLE001"]
