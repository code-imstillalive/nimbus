# https://developers.home-assistant.io/docs/apps/configuration
#
# Version is kept in lockstep with custom_components/nimbus_load/manifest.json.
# Rationale: the integration and this add-on are shipped and used as a single
# product. Independent versioning left add-on users unable to tell which
# Nimbus release they had installed. The 'version-lockstep' CI job enforces
# that these two version strings never drift.
name: "Nimbus Solver"
version: "0.94.40"
slug: nimbus_solver
description: >-
  Runs the Nimbus LP battery/grid dispatch Solver against your live Home
  Assistant sensors on a schedule and publishes the resulting plan as a
  forecast sensor. Purely observational -- never writes to Modbus, never
  calls a script, never touches anything but plain HA REST GET/POST.
  Configure everything else (battery capacity, grid limits, price
  sources) via the Nimbus integration's own "Solver settings" wizard
  first (Settings -> Devices & services -> Nimbus -> Configure) -- this
  app just needs to know how often to run.
url: "https://github.com/code-imstillalive/nimbus/tree/main/nimbus_solver_app"
arch:
  - amd64
  - aarch64
# No armv7/i386 -- highspy (the real, compiled LP solver this depends on)
# has no published wheel for 32-bit ARM as of 2026-08-21, only source,
# which this app deliberately doesn't attempt to build. Genuinely
# unsupported on an older 32-bit Raspberry Pi (Pi 3/Zero) -- the
# Forecaster half of Nimbus (installed separately via HACS) has no such
# limitation, since it's pure numpy with zero compiled dependencies.
init: false
startup: services
boot: auto
homeassistant_api: true
# ^ this is the whole point -- Supervisor auto-injects a working
# SUPERVISOR_TOKEN into this container and proxies HA's real REST API,
# so there's no manual long-lived-access-token file to create or manage
# at all, unlike the bare NUC-cron deployment this app is built from.
options:
  poll_interval_seconds: 60
schema:
  poll_interval_seconds: "int(15,3600)"
