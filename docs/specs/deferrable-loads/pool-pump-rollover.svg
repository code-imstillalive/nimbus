<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 284" width="900" height="284">
<style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1b1f24}
.h{font-size:15px;font-weight:700}
.ttl{font-size:13px;font-weight:600}
.lbl{font-size:11px}
.sm{font-size:10px;fill:#57606a}
.tick{font-size:10px;fill:#57606a}
.gl{stroke:#e8ebef;stroke-width:1}
.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1;rx:6}
.box2{fill:#ffffff;stroke:#8c959f;stroke-width:1;rx:6}
.arr{stroke:#57606a;stroke-width:1.4;fill:none;marker-end:url(#m)}
.arr2{stroke:#d1226b;stroke-width:1.4;fill:none;marker-end:url(#m2);stroke-dasharray:4 3}
</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d1226b"/></marker>
</defs>
<rect x="0" y="0" width="900" height="284" fill="#ffffff"/><text x="16" y="22" class="h">Use case: fixed daily run-hours with rollover</text><text x="60" y="44" class="ttl">Pool pump: 4 h/day quota, missed hours roll into the next day (cap: +1 day, max 8 h/day)</text>
<line x1="60" x2="880" y1="210.0" y2="210.0" class="gl"/>
<text x="54" y="214.0" text-anchor="end" class="tick">0 h</text>
<line x1="60" x2="880" y1="172.5" y2="172.5" class="gl"/>
<text x="54" y="176.5" text-anchor="end" class="tick">2 h</text>
<line x1="60" x2="880" y1="135.0" y2="135.0" class="gl"/>
<text x="54" y="139.0" text-anchor="end" class="tick">4 h</text>
<line x1="60" x2="880" y1="97.5" y2="97.5" class="gl"/>
<text x="54" y="101.5" text-anchor="end" class="tick">6 h</text>
<line x1="60" x2="880" y1="60.0" y2="60.0" class="gl"/>
<text x="54" y="64.0" text-anchor="end" class="tick">8 h</text>
<rect x="100" y="135.0" width="60" height="75.0" fill="#2f6fdb" opacity="0.2" stroke="#2f6fdb" stroke-dasharray="3 2"/>
<rect x="170" y="135.0" width="60" height="75.0" fill="#2f6fdb"/>
<text x="165" y="232" text-anchor="middle" class="tick">Mon</text>
<text x="130" y="131.0" text-anchor="middle" class="sm">target 4 h</text>
<text x="200" y="131.0" text-anchor="middle" class="sm">ran 4 h</text>
<rect x="290" y="135.0" width="60" height="75.0" fill="#2f6fdb" opacity="0.2" stroke="#2f6fdb" stroke-dasharray="3 2"/>
<rect x="360" y="163.1" width="60" height="46.9" fill="#2f6fdb"/>
<text x="355" y="232" text-anchor="middle" class="tick">Tue</text>
<text x="320" y="131.0" text-anchor="middle" class="sm">target 4 h</text>
<text x="390" y="159.1" text-anchor="middle" class="sm">ran 2.5 h</text>
<rect x="480" y="106.9" width="60" height="103.1" fill="#2f6fdb" opacity="0.2" stroke="#2f6fdb" stroke-dasharray="3 2"/>
<rect x="550" y="106.9" width="60" height="103.1" fill="#2f6fdb"/>
<text x="545" y="232" text-anchor="middle" class="tick">Wed</text>
<text x="510" y="102.9" text-anchor="middle" class="sm">target 5.5 h</text>
<text x="580" y="102.9" text-anchor="middle" class="sm">ran 5.5 h</text>
<rect x="670" y="135.0" width="60" height="75.0" fill="#2f6fdb" opacity="0.2" stroke="#2f6fdb" stroke-dasharray="3 2"/>
<rect x="740" y="135.0" width="60" height="75.0" fill="#2f6fdb"/>
<text x="735" y="232" text-anchor="middle" class="tick">Thu</text>
<text x="700" y="131.0" text-anchor="middle" class="sm">target 4 h</text>
<text x="770" y="131.0" text-anchor="middle" class="sm">ran 4 h</text>
<path d="M 390 147.1 C 420 75.0, 520 67.5, 580 90.9" class="arr2"/>
<text x="380" y="67.5" class="lbl" fill="#d1226b">1.5 h shortfall (evening price spike) carried into Wednesday</text>
<text x="60" y="256" class="sm">quota(d) = base_hours + carry(d−1);   carry(d) = min(max(0, quota(d) − delivered(d)), carry_cap)</text>
<text x="60" y="270" class="sm">Shortfall is priced, not forced: the LP can choose to fall short on a genuinely bad day and make it up on the next.</text></svg>