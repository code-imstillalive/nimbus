<text x="60.0" y="302" text-anchor="middle" class="tick">00:00</text>
<text x="167.0" y="302" text-anchor="middle" class="tick">03:00</text>
<text x="273.9" y="302" text-anchor="middle" class="tick">06:00</text>
<text x="380.9" y="302" text-anchor="middle" class="tick">09:00</text>
<text x="487.8" y="302" text-anchor="middle" class="tick">12:00</text>
<text x="594.8" y="302" text-anchor="middle" class="tick">15:00</text>
<text x="701.7" y="302" text-anchor="middle" class="tick">18:00</text>
<text x="808.7" y="302" text-anchor="middle" class="tick">21:00</text>
<text x="60" y="324" class="sm">A grid-price rule (run when import &lt; 7¢) would run 11:00–15:00 only. The shadow-price rule also runs 07:00–10:00, when PV would otherwise be curtailed —</text>
<text x="60" y="337" class="sm">and it would run at night if a full battery had nothing better to do with its energy. Same knob, no rule to maintain: the LP decides from λ(t).</text></svg>