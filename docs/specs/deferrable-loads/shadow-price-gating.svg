<path d="M 60.0 172.0 L 95.7 172.0 L 131.3 172.0 L 167.0 172.0 L 202.6 172.0 L 238.3 168.2 L 273.9 164.5 L 309.6 179.5 L 345.2 194.5 L 380.9 200.1 L 416.5 201.2 L 452.2 201.2 L 487.8 201.2 L 523.5 201.2 L 559.1 200.9 L 594.8 194.5 L 630.4 168.2 L 666.1 168.2 L 701.7 168.2 L 737.4 168.2 L 773.0 168.2 L 808.7 172.0 L 844.3 172.0 L 880.0 172.0" fill="none" stroke="#2f6fdb" stroke-width="2.4"/>
<line x1="60" x2="880" y1="175.8" y2="175.8" stroke="#d1226b" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="66" y="188.8" text-anchor="start" class="sm" fill="#d1226b">miner value_per_kwh = 7¢ (from a hashprice entity)</text>
<rect x="60" y="58" width="10" height="10" fill="#e8890c"/><text x="74" y="67" class="tick">grid import price</text>
<rect x="180" y="58" width="10" height="10" fill="#2f6fdb"/><text x="194" y="67" class="tick">switchboard λ(t) = dual of power_balance_t</text>
<text x="452.2" y="89.5" text-anchor="middle" class="lbl" fill="#2f6fdb">λ≈0: PV surplus would be curtailed — free at the switchboard</text>
<text x="452.2" y="102.5" text-anchor="middle" class="lbl" fill="#2f6fdb">even though the grid says 5–8¢</text>
<path d="M 452.2 107.5 L 452.2 195.2" class="arr"/>
<text x="876.0" y="146.2" text-anchor="end" class="lbl" fill="#2f6fdb">λ≈9¢ overnight: battery discharge value, not the 36¢ grid price</text>
<text x="60" y="226" class="ttl">Miner runs exactly where λ(t) ≤ value_per_kwh — an LP optimality condition, not a threshold rule</text>
<line x1="60" x2="880" y1="284.0" y2="284.0" class="gl"/>
<text x="54" y="288.0" text-anchor="end" class="tick">0 kW</text>
<line x1="60" x2="880" y1="234.0" y2="234.0" class="gl"/>
<text x="54" y="238.0" text-anchor="end" class="tick">2 kW</text>
