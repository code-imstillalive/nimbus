# !!! DO NOT COPY THIS FILE VERBATIM FOR YOUR OWN INSTALL !!!
#
# This is 116KAT's OWN real hardware — its actual, literal sensor entity
# IDs (sensor.battery_power_signed_inv1, sensor.string3_power_inv1, etc.)
# for ONE specific household's Sungrow inverter setup. None of these
# entities exist on your system. Copying this file as-is will produce an
# empty/broken topology card, not a working one.
#
# THE REAL, PORTABLE WAY TO CONFIGURE YOUR OWN TOPOLOGY: Nimbus's own
# hub -> Configure -> "Solver settings" -> Topology wizard (Power
# Source / PV String / Battery Tower / Switchboard steps -- real HA UI
# forms, your own entity pickers, your own real sensors). The wizard's
# live-discovered data (exposed via sensor.nimbus_topology_config,
# NimbusTopologyConfigSensor) WHOLESALE-OVERRIDES this file the moment
# even one Power Source subentry exists -- topology-card-v4.js's own
# _discoverTopologyConfig() checks for that first, on every render, and
# only ever falls back to a static file like this one if the wizard has
# genuinely never been run. This is the only file `topology-card-v4.js`
# needs zero configuration for -- it has no hardcoded device-entity
# reference anywhere in its own JS logic; every sensor.* it displays
# comes from whatever config reaches it (live wizard data, or a static
# file like this).
#
# 2026-08-23 update: grid_meter, battery_power, import_price, and
# export_price below are now ALSO auto-detected live, through two
# separate, independent mechanisms -- neither needs this file OR the
# wizard's Switchboard step once configured:
#   - grid_meter/battery_power: from whichever Nimbus Power Signal
#     subentry has an explicit signal_role of "grid"/"battery" (Nimbus
#     hub -> the signal -> Reconfigure -> role dropdown).
#   - import_price/export_price: from Nimbus's own Solver config
#     (solver_import_price_sensor/solver_export_price_sensor, set once
#     in the Solver wizard's Grid step) -- see
#     _discoverPriceFromSolverConfig()'s own header comment in
#     topology-card-v4.js for why (a household correction after
#     entering the same price sensor twice, once per wizard, let the two
#     drift out of sync with each other).
# The remaining daily-kWh fields (house_load_energy_daily,
# solar_energy_daily, battery_charge_daily, battery_discharge_daily,
# import_energy_daily, export_energy_daily) have no Nimbus equivalent at
# all -- Nimbus is a forecaster, not an energy-accounting layer -- so
# they stay wizard/file-configured only.
#
# What this file IS actually useful for: a real, worked, end-to-end
# example of the shape the wizard produces -- read it to understand the
# fields, not to fill in your own entity IDs by hand. If you never run
# the wizard, it also serves as `lovelace_build_topology_dashboard.py`'s
# initial-generate INPUT (the very first version of the dashboard view,
# before any live data exists to override it) -- for that purpose alone,
# you WOULD need to replace every sensor.* below with your own real
# entities. The wizard is still the easier, recommended path; editing
# this file by hand is the fallback for anyone who'd rather not use a
# config-flow UI.
#
# NOT a live HA package (not loaded via !include_dir_named integrations) —
# a plain data file, read by scripts/lovelace_build_topology_dashboard.py to
# generate the topology dashboard view's INITIAL card config (the live
# per-render wizard discovery above then overrides it, for any install
# that has migrated). Adding a new PV string or battery tower to a
# static-file-only setup (genuine physical wiring facts — not something
# any sensor naming convention could infer) means adding an entry here
# and re-running that script — never hand-edit dashboard cards for this
# view directly.
#
# LOADS ARE THE ONE EXCEPTION — deliberately NOT listed here since 2026-08-20
# (v7 of topology-card-v4.js). Every Nimbus "load" subentry (HWS, pool, an
# individual circuit breaker — anything added via the Nimbus hub's own
# "+ Add" -> Load) auto-publishes a forecast sensor the card discovers
# directly from live hass state on every render (see that file's own header
# comment for the exact mechanism). Add a load in the Nimbus UI and it
# appears on the topology card immediately — no editing this file, no
# re-running the generator script, no restart.
#
# Real, confirmed data (not guessed) as of 2026-08-14, on 116KAT's own
# real hardware:
#   - 2 inverters: inv1 (SH25T) has 5 string inputs but only String 3 (->MPPT2)
#     and String 5 (->MPPT3) are physically active (Strings 1/2/4 read 0W);
#     inv2 (SH15T) has 2 string inputs, only String 1 (->MPPT1) is active.
#     Confirmed by matching each active string's live power reading against
#     its corresponding MPPT's own power reading -- they match exactly.
#   - 4 real, distinct battery towers, mapped to inverters as confirmed
#     directly by the household (interleaved, not paired by adjacent number):
#     Tower 1 & 3 -> SH15T (inv2), Tower 2 & 4 -> SH25T (inv1).
#   - Grid meter: sensor.logger_meter_total_active_power (the real, uncapped
#     meter -- distinct from any HAEO plan/forecast sensor, which is not a
#     measurement -- a real gotcha on Sungrow-based installs in general).
#   - Battery power: sensor.logger_battery_power -- the real Modbus-measured
#     value (positive = discharging into the house, negative = charging),
#     used to compute the switchboard's live source-mix coloring.
#   - 18 loads, each already forecast by Nimbus -- entity names below
#     confirmed live against this household's own real Nimbus load list.

# Weather entity: any real HA weather integration works -- 116KAT uses
# weather.pirateweather. nimbus_version below is only a FALLBACK
# (2026-08-20, Nimbus v0.30.0+): topology-card-v4.js reads the real, live
# version directly off any Nimbus device's own sw_version (Nimbus's own
# sensor.py sets this from its manifest.json at startup, single source
# of truth) and only falls back to this static string if that live
# lookup can't find anything.
weather: weather.pirateweather
nimbus_version: "0.73.0"

switchboard:
  # grid_meter/battery_power/import_price/export_price: fallback-only as
  # of 2026-08-23 -- see the header comment above. Kept here so a fresh
  # install (wizard/role/Solver-config not yet run) still shows
  # something sane rather than blank.
  grid_meter: sensor.logger_meter_total_active_power
  import_price: sensor.localvolts_costs_flex_up
  export_price: sensor.localvolts_earnings_flex_up
  battery_power: sensor.logger_battery_power
  import_energy_daily: sensor.inverter_import_energy_daily
  export_energy_daily: sensor.inverter_export_energy_daily
  house_load_energy_daily: sensor.house_load_energy_daily
  solar_energy_daily: sensor.combined_daily_pv_generation
  battery_charge_daily: sensor.combined_daily_battery_charge
  battery_discharge_daily: sensor.combined_daily_battery_discharge

# Per-load and per-PV-string daily kWh (produced/consumed) were asked for
# too -- the real sunsynk/power-flow-card-plus configs only track daily kWh
# per COMBINED category (HWS, Pool, AC, whole-house, whole-solar, whole-
# battery), not per individual Nimbus-forecast circuit. The card supports
# an optional `energy_today: sensor.x` field on any load/pv_strings entry
# below for whenever a real per-circuit sensor is confirmed -- inventing
# one here would just show broken/misleading data instead of the real
# thing.

inverters:
  - id: inv1
    name: Inverter 1 (SH25T)
    # Real, signed per-inverter battery power (confirmed live 2026-08-14,
    # matches sensor.battery_power_signed_inv1/2 against a genuine
    # discharge event): positive = discharging, negative = charging. No
    # reliable per-tower power/current exists (both towers' _current read
    # 0.0A even while their own inverter was actively discharging 13.4kW),
    # so this per-inverter figure is the real, correct granularity to
    # drive the battery-chain arrow direction/color on the topology card.
    battery_power: sensor.battery_power_signed_inv1
    # Real per-inverter total DC power (sensor.total_dc_power_inv1, real
    # Sungrow register -- confirmed live 2026-08-22: 1020W vs the sum of
    # this inverter's own 2 active strings, 541+545=1086W, close enough
    # given the two readings land a few seconds apart from independent
    # poll cycles, not a mismatch). This is genuinely different from
    # battery_power above -- DC power is total PV throughput regardless
    # of whether the battery is doing anything at all (confirmed live:
    # battery_power was legitimately 0W with both towers full while DC
    # power was a real, nonzero >1000W, solar flowing straight through to
    # the switchboard). Direct household catch: the card's own inverter
    # header was showing ONLY battery_power, making a fully-charged,
    # solar-producing inverter look falsely idle.
    dc_power: sensor.total_dc_power_inv1
    pv_strings:
      - entity: sensor.string3_power_inv1
        mppt: 2
      - entity: sensor.string5_power_inv1
        mppt: 3
    battery_towers:
      - battery_tower_2
      - battery_tower_4
  - id: inv2
    name: Inverter 2 (SH15T)
    battery_power: sensor.battery_power_signed_inv2
    dc_power: sensor.total_dc_power_inv2
    pv_strings:
      - entity: sensor.string1_power_inv2
        mppt: 1
    battery_towers:
      - battery_tower_1
      - battery_tower_3

# battery_towers above reference the ID prefix only (e.g. "battery_tower_2")
# -- each tower's own real entities all share this prefix:
#   sensor.<prefix>_soc, _soh, _voltage, _current, _temperature, _status,
#   sensor.<prefix>_total_battery_charge, _total_battery_discharge
# The generator script expands these itself rather than listing every
# entity by hand here.

whole_house:
  forecast: sensor.nimbus_logger_load_power_forecast
  live: sensor.logger_load_power
