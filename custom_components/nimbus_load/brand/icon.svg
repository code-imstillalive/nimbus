<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Simple two-tone cloud cutout. Dark tone = base cloud silhouette,
       light tone = a single cutout highlight -- no gradients, no photo
       imagery, matches the "simple single/dual-tone cutout" brief. -->
  <rect width="256" height="256" fill="none"/>
  <path
    d="M 76 168
       C 50 168 30 148 30 122
       C 30 98 48 78 72 76
       C 78 50 101 32 128 32
       C 157 32 181 53 186 82
       C 210 85 228 105 228 130
       C 228 156 207 178 180 178
       L 76 178
       Z"
    fill="#3B4A6B"/>
  <path
    d="M 128 32
       C 101 32 78 50 72 76
       C 48 78 30 98 30 122
       C 30 148 50 168 76 168
       L 128 168
       Z"
    fill="#8FA6D9"/>
</svg>
