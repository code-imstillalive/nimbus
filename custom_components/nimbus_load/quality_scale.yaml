rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      nimbus issue #361 (Mark Purcell): this previously claimed "no service
      actions", which was already false -- services.py registers 3 real ones
      (retrain, solve_now, compute_quality_report) via
      async_register_services(), called from async_setup_entry() and
      idempotent across reloads (test_async_register_services_is_idempotent_
      on_reload).
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Custom brand/icon.png in this repo works via HACS's local fallback, but
      isn't upstreamed to home-assistant/brands (custom_integrations/nimbus_load/).
      Needs a PR to that separate repo -- can't be completed from inside this one.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: >-
      tests/v2/setup/test_config_flow_entry.py covers hub creation, the unique-id guard, and
      subentry-type registration. tests/test_flows_{load,signal,power_source,
      pv_string,battery_tower}_subentry.py each cover creation AND reconfigure
      paths (prefill from existing data, no-input-shows-form, alias delegation).
  config-flow: done
  data-description:
    status: done
    comment: >-
      Every field across every options step (forecaster/solver_battery/
      solver_grid/solver_sources/switchboard) and every config-subentry
      (load/power_signal/power_source/pv_string/battery_tower) in strings.json
      has a data_description sibling. translations/en.json kept byte-identical.
      nimbus issue #361 (Mark Purcell): this claim was false as of v0.94.63 --
      9 fields across the forecaster/solver_sources steps had no data/
      data_description entry at all (rendered as raw snake_case keys in the
      real UI), and solver_weather_forecast_sensor had a label but no
      description. Fixed the same release this comment was corrected.
  data-vs-options:
    status: done
    comment: >-
      Hub entry.data is {} at creation (config_flow.py:100) -- nothing
      meaningful to configure until the wizard runs. Every hub-level Solver/
      Forecaster setting lives in entry.options via NimbusHubOptionsFlow
      (OptionsFlowWithConfigEntry, flows/hub_options.py), the correct modern
      split.
  dependency-transparency:
    status: done
    comment: >-
      manifest.json requirements pinned: numpy>=1.24,<3, highspy>=1.15.1,<2.
  docs-actions:
    status: done
    comment: >-
      nimbus issue #361: same correction as action-setup above -- 3 real
      service actions exist and are fully documented in services.yaml.
  docs-triggers:
    status: exempt
    comment: No triggers.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description:
    status: done
    comment: >-
      README.md opens with a one-paragraph plain-English description
      ("A self-retraining ML load forecaster...") before any maintainer/
      debug content -- no restructure needed on re-check.
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: >-
      README.md's own "## Removing Nimbus" section: hub deletion (removes
      every subentry/entity/device), HACS uninstall, the two .storage/ files
      Nimbus writes that neither step clears, and the separate add-on's own
      removal steps if installed.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: >-
      entry.runtime_data (a dict keyed by subentry_id) throughout __init__.py/
      sensor.py/diagnostics.py -- confirmed via grep, no hass.data[DOMAIN]
      pattern remains.
  test-before-configure:
    status: done
    comment: >-
      Mark Purcell, 8 Nov 2026 (#2392): every wizard step that takes an
      entity refuses one that is neither a current state nor in the entity
      registry (`entity_not_found` on that field), and accepts one that
      exists but is not reporting yet, with a warning in the log.
      flows.missing_entity_errors() reads each step's own schema, sections
      included. Hub creation itself takes no fields.
  test-before-setup:
    status: done
    comment: >-
      solver_runtime.py's _blocking() catches ImportError/ModuleNotFoundError
      from _ensure_ready() (the real failure mode: no highspy wheel for this
      host's architecture) and fires a real persistent_notification exactly
      once per HA session, rather than letting it propagate as a bare
      exception in HA's periodic-task dispatcher every cycle. Deliberately
      does NOT raise ConfigEntryNotReady from async_setup_entry itself, since
      that would incorrectly couple the Forecaster's setup (zero highspy
      dependency, works on every architecture) to the Solver's optional one --
      async_setup_entry never touches highspy at all, only the later,
      genuinely-async periodic timer does.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >-
      nimbus issue #361: same correction as action-setup above. retrain
      raises ServiceValidationError for an unresolved/partially-matched
      entity_id; compute_quality_report raises ServiceValidationError for
      shape errors (naive datetime, end <= start, window in the future --
      see issue #345's own fix) and HomeAssistantError for genuine scoring
      failures; solve_now never raises by contract (async_run_solve()'s own
      "never raises" guarantee), logging a warning on a failed solve instead.
  config-entry-unloading:
    status: done
    comment: >-
      Both real timers are correctly cancelled via entry.async_on_unload():
      the 1-minute native Solver timer (__init__.py) and the daily-retrain
      time_change listener per coordinator (coordinator.py's _unsub_retrain,
      stored + called in async_unload()). Verified directly, not assumed --
      the original Silver checklist flagged this as "worth double-checking,"
      now confirmed correct.
  docs-configuration-parameters:
    status: done
    comment: >-
      docs/configuration-reference.md -- every field across every Configure
      step and every subentry type, plus a full default/range/unit table
      for all 36 number.nimbus_solver_* entities, generated directly from
      number.py's own real _DESCRIPTIONS tuple.
  docs-installation-parameters:
    status: done
    comment: Same doc as docs-configuration-parameters above -- covers both.
  entity-unavailable:
    status: done
    comment: >-
      NimbusForecastSensor already had this (2026-08-22, via
      CoordinatorEntity's own re-poll-on-a-schedule). The two Solver push
      sensors (_NimbusSolverPushSensor) had no coordinator and no
      `available` override at all -- fixed 2026-08-23 with a staleness
      threshold (5 min, 5x the native runtime's 1-min cadence) plus a
      self-driven periodic re-check timer (async_added_to_hass), since a
      pure elapsed-time property alone never gets re-evaluated once the
      Solver genuinely stops calling update_from_solver().
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Both entity classes log exactly once per genuine transition (both
      directions), never per-tick -- confirmed via dedicated tests
      (test_recheck_does_not_log_again_on_a_second_still_unavailable_tick).
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 already present in sensor.py, number.py, and
      switch.py -- correct given the coordinator design handles its own
      rate-limiting.
  reauthentication-flow:
    status: exempt
    comment: >-
      No external service authentication; the integration reads local HA
      sensors and does not authenticate against any remote service.
  test-coverage:
    status: todo
    comment: >-
      Measured on CI, combined stub and real-HA runs (main at 8c64e85,
      10 Nov 2026): 97.8% overall, against a 75% fail-under floor. The rule
      asks for 95% in every module; 2 of 137 are still below it:
      device_contract_ha.py (93%) and flows/device_setup.py (94%). The 24
      others were closed under #2393 with tests-only PRs, mostly as cases
      added to existing tests, so the count stayed well under the cap.

  # Gold
  devices: done
  diagnostics:
    status: done
    comment: >-
      diagnostics.py's async_get_config_entry_diagnostics() -- entry title/
      options, every subentry's type/title/config/coordinator health
      (training_points, validation_mae/mase, forecast point count/span), and
      a real Solver health snapshot (status, solve_seconds, binding
      constraint, load-forecast-source-error visibility). TO_REDACT is a
      deliberate empty tuple, not omitted -- see the file's own docstring.
      tests/test_diagnostics.py covers it directly.
  discovery-update-info:
    status: exempt
    comment: No network discovery.
  discovery:
    status: exempt
    comment: >-
      ML forecaster integration reading local Home Assistant sensors; no
      physical device or network service to discover.
  docs-data-update:
    status: done
    comment: >-
      docs/how-nimbus-updates.md: the plan every 5 minutes (30 s after each
      5-minute mark) plus price-change and P2P-block triggers, load forecasts
      every 2 minutes, the daily retrain, the daily reports and setup health.
  docs-examples:
    status: done
    comment: >-
      docs/going-live.md walks through two importable automation blueprints
      (blueprints/automation/nimbus/battery_dispatch.yaml and
      site_import_guard.yaml) with worked inverter actions, and
      docs/dashboards.md has the Lovelace card examples.
  docs-known-limitations:
    status: done
    comment: >-
      docs/known-limitations.md: no battery control by itself (dry-run
      dispatcher only), history needed before a forecast, one hub, Australian
      built-in providers, daily retrain, Regret cards solving on open, and the
      Home Assistant and Python requirements.
  docs-supported-devices:
    status: exempt
    comment: Not device-based.
  docs-supported-functions:
    status: done
    comment: >-
      docs/what-nimbus-provides.md: every entity kind (sensor, number, switch,
      select, time) with examples and links, and all 14 actions; every
      setting is in configuration-reference.md.
  docs-troubleshooting:
    status: done
    comment: >-
      docs/troubleshooting.md, published in the user docs: Repairs first,
      common problems, a one-step diagnostic check, and how to report one.
  docs-use-cases:
    status: done
    comment: >-
      docs/use-cases.md: time-of-use and wholesale price shifting, selling
      into a price spike, P2P export commitments, EV charged by departure,
      controllable loads, load forecasting, and the daily hindsight score,
      each linked to its setup page.
  dynamic-devices: done
  entity-category:
    status: done
    comment: >-
      All 38 number.nimbus_solver_* entities (number.py) and the one
      switch.nimbus_auto_include_known_solar (switch.py) are
      EntityCategory.CONFIG -- Solver tuning knobs, not primary readings.
      The two hub-level bridge sensors (NimbusSolverConfigSensor,
      NimbusTopologyConfigSensor) deliberately keep entity_category = None
      -- both are real, actively-read data sources external scripts/cards
      depend on (the Solver writer script's own config source; the
      topology card's own live discovery source), not diagnostics, per
      each class's own existing comment. tests/test_number_solver_settings.py
      and tests/test_switch_solver_toggle.py both assert the CONFIG
      category directly.
  entity-device-class:
    status: done
    comment: >-
      Every number.py field with a kW/kWh unit carries a matching
      NumberDeviceClass (POWER / ENERGY / ENERGY_STORAGE, distinguished
      correctly -- battery capacity is ENERGY_STORAGE, the P2P bonus
      volume field is plain ENERGY) -- confirmed by 4 dedicated tests in
      tests/test_number_solver_settings.py, including an inverse check
      that no kW/kWh field was accidentally left without one. Fields with
      no real matching HA device class (%, $/kWh, hour) correctly have
      device_class = None, also asserted directly, not just assumed.
      switch.py's one entity has no applicable SwitchDeviceClass (those
      model a physical switch/outlet, not a config toggle) -- N/A.
  entity-disabled-by-default:
    status: done
    comment: >-
      Mark Purcell, 8 Nov 2026 (#2392): a DIAGNOSTIC entity starts disabled
      on a new install, except those Nimbus's own tabs and cards display
      (sensor_flattened.SHOWN_ON_DASHBOARD, and the controllable-load
      sensors the Topology card reads). A guard test checks the set against
      the tab and card sources.
  entity-translations:
    status: done
    comment: >-
      Every entity name is in strings.json under entity.<platform>.<key>.name
      and the entity carries _attr_translation_key (no _attr_name is left).
      The English text is the name each entity had before, so entity ids
      derived from a name are unchanged. scripts/entity_translations.py
      reads the names from the code's own tables; a test keeps them in step.
  exception-translations:
    status: done
    comment: >-
      Every user-facing HomeAssistantError and ServiceValidationError (20,
      in services.py and select.py) carries translation_domain, a
      translation_key and its placeholders, with the text in strings.json's
      `exceptions` section. The English message is still passed as the
      exception's own text, so logs read the same.
  icon-translations:
    status: done
    comment: >-
      icons.json holds every service's icon and the three entities that had
      one in code (by translation key); no entity sets _attr_icon. Others use
      their device_class defaults. A test keeps icons.json and services.yaml
      in step.
  reconfiguration-flow:
    status: done
    comment: >-
      flows/load_subentry.py and every other subentry flow implement
      async_step_reconfigure -- confirmed via grep, prefill-from-existing
      and no-input-shows-form both covered by
      tests/test_flows_*_subentry.py.
  repair-issues:
    status: done
    comment: >-
      Repairs are raised where the household has to act: a new install whose
      setup failed (__init__.py), device setup drift, a stated unit that
      disagrees and an older setup to update (device_contract_ha.py), a setup
      field that is blocked (setup_builder.py), and setup health problems
      such as a dashboard with Nimbus cards but no Tabs card
      (setup_health.py). Each has its own translation key.
  stale-devices:
    status: done
    comment: >-
      Confirmed directly against homeassistant/config_entries.py (dev
      branch, 2026-08-23): ConfigEntries.async_remove_subentry() already
      calls dev_reg.async_clear_config_subentry() and
      ent_reg.async_clear_config_subentry() automatically -- HA core
      itself removes a subentry's device/entities on deletion, PROVIDED
      they were registered with config_subentry_id in the first place.
      sensor.py's async_setup_entry already does this correctly for the
      one class of entity that owns a per-subentry device
      (NimbusForecastSensor, config_subentry_id=subentry.subentry_id);
      every hub-scoped entity deliberately does NOT carry one (would
      wrongly delete hub-level entities on any subentry removal).
      tests/test_stale_devices_cleanup.py locks in both directions via
      direct AST inspection of sensor.py's own async_add_entities calls,
      so a future refactor silently dropping the kwarg (which would
      reopen this exact leak) fails a test instead of shipping quietly.

  # Platinum
  async-dependency:
    status: exempt
    comment: >-
      Runtime deps (manifest.json): numpy and highspy -- both pure-CPU
      libraries, no I/O, nothing to make async. Every genuinely blocking
      operation (recorder history reads, model train/predict, LP solves,
      pickle load/save) is dispatched via hass.async_add_executor_job
      instead -- 16 real call sites, confirmed by grep, not just claimed.
  inject-websession:
    status: exempt
    comment: >-
      No HTTP client anywhere in the dependency tree (confirmed: no
      aiohttp/httpx/requests in manifest.json's requirements). Reads HA
      sensor states via the core API only. Would become applicable if a
      future feature reaches out to an external forecast provider.
  strict-typing:
    status: todo
    comment: >-
      py.typed marker exists. Since 8 Nov 2026 (#2289 item 9) a blocking CI
      job, "Type Check (mypy, solver+ml)", covers every module that does not
      import Home Assistant: solver/, ml/ and 60 entries in all, with zero
      findings. The modules that import Home Assistant (entities, flows,
      coordinator) are still in the advisory whole-package job, so the rule
      is not yet met.
