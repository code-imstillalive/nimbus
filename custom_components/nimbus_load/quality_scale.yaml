rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration provides no service actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Custom brand/icon.png in this repo works via HACS's local fallback, but
      isn't upstreamed to home-assistant/brands (custom_integrations/nimbus_load/).
      Needs a PR to that separate repo -- can't be completed from inside this one.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: >-
      tests/test_config_flow.py covers hub creation, the unique-id guard, and
      subentry-type registration. tests/test_flows_{load,signal,power_source,
      pv_string,battery_tower}_subentry.py each cover creation AND reconfigure
      paths (prefill from existing data, no-input-shows-form, alias delegation).
  config-flow: done
  data-description:
    status: done
    comment: >-
      Every field across every options step (forecaster/solver_battery/
      solver_grid/solver_sources/switchboard) and every config-subentry
      (load/power_signal/power_source/pv_string/battery_tower) in strings.json
      has a data_description sibling. translations/en.json kept byte-identical.
  data-vs-options:
    status: done
    comment: >-
      Hub entry.data is {} at creation (config_flow.py:100) -- nothing
      meaningful to configure until the wizard runs. Every hub-level Solver/
      Forecaster setting lives in entry.options via NimbusHubOptionsFlow
      (OptionsFlowWithConfigEntry, flows/hub_options.py), the correct modern
      split.
  dependency-transparency:
    status: done
    comment: >-
      manifest.json requirements pinned: numpy>=1.24,<3, highspy>=1.15.1,<2.
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-triggers:
    status: exempt
    comment: No triggers.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description:
    status: done
    comment: >-
      README.md opens with a one-paragraph plain-English description
      ("A self-retraining ML load forecaster...") before any maintainer/
      debug content -- no restructure needed on re-check.
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: >-
      README.md's own "## Removing Nimbus" section: hub deletion (removes
      every subentry/entity/device), HACS uninstall, the two .storage/ files
      Nimbus writes that neither step clears, and the separate add-on's own
      removal steps if installed.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: >-
      entry.runtime_data (a dict keyed by subentry_id) throughout __init__.py/
      sensor.py/diagnostics.py -- confirmed via grep, no hass.data[DOMAIN]
      pattern remains.
  test-before-configure:
    status: exempt
    comment: >-
      Hub creation (config_flow.py's async_step_user) has no external
      connection/credential to test -- zero fields, purely local. The one
      real optional dependency (highspy) is never imported at hub-creation
      time by design (lazy, only on the Solver's first periodic solve) --
      see test-before-setup below for how that failure mode is actually
      handled. Subentry creation (load_subentry.py) does validate its own
      source sensor exists before allowing creation.
  test-before-setup:
    status: done
    comment: >-
      solver_runtime.py's _blocking() catches ImportError/ModuleNotFoundError
      from _ensure_ready() (the real failure mode: no highspy wheel for this
      host's architecture) and fires a real persistent_notification exactly
      once per HA session, rather than letting it propagate as a bare
      exception in HA's periodic-task dispatcher every cycle. Deliberately
      does NOT raise ConfigEntryNotReady from async_setup_entry itself, since
      that would incorrectly couple the Forecaster's setup (zero highspy
      dependency, works on every architecture) to the Solver's optional one --
      async_setup_entry never touches highspy at all, only the later,
      genuinely-async periodic timer does.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading:
    status: done
    comment: >-
      Both real timers are correctly cancelled via entry.async_on_unload():
      the 1-minute native Solver timer (__init__.py) and the daily-retrain
      time_change listener per coordinator (coordinator.py's _unsub_retrain,
      stored + called in async_unload()). Verified directly, not assumed --
      the original Silver checklist flagged this as "worth double-checking,"
      now confirmed correct.
  docs-configuration-parameters:
    status: done
    comment: >-
      docs/configuration-reference.md -- every field across every Configure
      step and every subentry type, plus a full default/range/unit table
      for all 36 number.nimbus_solver_* entities, generated directly from
      number.py's own real _DESCRIPTIONS tuple.
  docs-installation-parameters:
    status: done
    comment: Same doc as docs-configuration-parameters above -- covers both.
  entity-unavailable:
    status: done
    comment: >-
      NimbusForecastSensor already had this (2026-08-22, via
      CoordinatorEntity's own re-poll-on-a-schedule). The two Solver push
      sensors (_NimbusSolverPushSensor) had no coordinator and no
      `available` override at all -- fixed 2026-08-23 with a staleness
      threshold (5 min, 5x the native runtime's 1-min cadence) plus a
      self-driven periodic re-check timer (async_added_to_hass), since a
      pure elapsed-time property alone never gets re-evaluated once the
      Solver genuinely stops calling update_from_solver().
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Both entity classes log exactly once per genuine transition (both
      directions), never per-tick -- confirmed via dedicated tests
      (test_recheck_does_not_log_again_on_a_second_still_unavailable_tick).
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 already present in sensor.py, number.py, and
      switch.py -- correct given the coordinator design handles its own
      rate-limiting.
  reauthentication-flow:
    status: exempt
    comment: >-
      No external service authentication; the integration reads local HA
      sensors and does not authenticate against any remote service.
  test-coverage:
    status: todo
    comment: >-
      Real, measured (not assumed): 59% overall as of 2026-08-23, up from
      54% at the start of this pass (a pytest-cov config bug was also
      found and fixed here -- the tool had been silently reporting the
      entire solver/ package at 0% due to a dotted-vs-bare import-path
      artifact, hiding real existing coverage). 3 previously-zero-coverage
      solver modules (modes.py, counterfactuals.py, rolling.py) taken to
      100% this pass (34 new tests) -- all three are currently dead code,
      not yet wired into anything live. Real remaining gaps: coordinator.py
      (38%), ml/model.py + ml/gbrt.py (~21-23%), solver_writer.py (22%,
      ~2400 lines, largely I/O-heavy and historically validated against
      real live data rather than pure unit tests). Silver's own bar is
      95% across all integration modules -- honestly far from met, left
      as a real, sized, future body of work rather than claimed done.
