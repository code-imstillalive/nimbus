rules:
  # Bronze -- audited by Mark Purcell, issue #37, 2026-08-22 (manifest 0.53.0)
  action-setup:
    status: exempt
    comment: This integration provides no service actions.
  appropriate-polling: done
  brands: todo  # icon exists in repo, not yet upstreamed to home-assistant/brands
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency: todo  # highspy is unpinned in manifest.json requirements
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-triggers:
    status: exempt
    comment: No triggers.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: todo
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: todo  # coordinator stored on hass.data[DOMAIN], not entry.runtime_data
  test-before-configure: todo
  test-before-setup: todo  # async_setup_entry doesn't raise ConfigEntryNotReady on missing deps
  unique-config-entry: done

  # Silver -- issue #38
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading: done  # verify daily-retrain + solver timer cancellation on unload
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done  # fixed 2026-08-22: NimbusForecastSensor.available checks last_update_success, coordinator.data, and the real live source sensor state
  integration-owner: done
  log-when-unavailable: done  # fixed alongside entity-unavailable, same commit -- logs exactly once per real transition, not per-tick
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: >
      No external service authentication; the integration reads local HA
      sensors and does not authenticate against any remote service.
  test-coverage: todo  # solver/ + ml/blend.py well-covered; coordinator.py, sensor.py, number.py, switch.py, config_flow.py, flows/*.py have zero tests

  # Gold -- issue #39
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: No network discovery.
  discovery:
    status: exempt
    comment: >
      ML forecaster integration reading local Home Assistant sensors; no
      physical device or network service to discover.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: Not device-based.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices: todo  # verify subentry deletion cleans up its device registry entry

  # Platinum -- issue #40
  async-dependency:
    status: exempt
    comment: >
      Runtime dependencies are numpy (computational) and highspy (LP
      solver, C++ bindings) -- neither is a candidate for async. All
      potentially-slow operations are dispatched via
      hass.async_add_executor_job to keep the event loop free.
  inject-websession:
    status: exempt
    comment: >
      Integration has no HTTP dependencies; reads Home Assistant sensor
      states via the HA core API only.
  strict-typing: todo  # 93%/97% annotation coverage already; needs py.typed (done), mypy config, CI check
